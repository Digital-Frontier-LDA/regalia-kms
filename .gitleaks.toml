# Secret scanning for a repository whose entire purpose is key custody.
#
# The scan runs over the whole tree, not a diff: a secret removed in a later commit is still
# published. Policy: allowlists describe CONTENT only — NO ALLOWLIST MAY NAME A PATH. A path
# allowlist silently blinds an entire file, so a real key planted beside a benign construct would
# pass. A content pattern narrow enough to name the benign construct cannot do that.
#
# Before adding an entry: the finding is probably prose or a fixture, and COMPOSITION is the fix.
# Write a literal header as "-----BEGIN " + "PRIVATE KEY-----" and the scanner does not fire while
# the assembled value is byte-identical. An entry here is only for a literal that cannot be composed
# away and is pinned by exact value.

[extend]
useDefault = true

[[allowlists]]
description = "PKCS#11 key-type constants: `keyType == pkcs11.CKK_RSA` reads as high entropy to the generic rule"
regexTarget = "line"
regexes = ['''keyType == pkcs11\.CKK_[A-Z0-9_]+''']

[[allowlists]]
description = "Sequential-hex placeholder used as a test idempotency key: a counting sequence, not a credential"
regexes = ['''^1234567890abcdef$''']

[[allowlists]]
description = "wrapped_data_key_base64 test fixtures, pinned by exact value; each decodes to short ASCII, none is secret"
regexes = [
    '''^U0VOU0lUSVZFX0NBTkFSWQ==$''',
    '''^c2VjcmV0LWVudmVsb3BlLWZpeHR1cmU=$''',
    '''^d3JhcHBlZA==$''',
]

[[allowlists]]
description = "Ed25519 PUBLIC keys of regalia-ceremony's fixed test seeds in tests/vectors/card-ceremony-record/ (copied from regalia-ceremony#121, qubes/emulator/tests/vectors/card-ceremony-record/make.py: bytes([n]) * 32 for n = 1, 2, 11, 12, 13), pinned by value"
regexTarget = "secret"
regexes = [
    '''^8a88e3dd7409f195fd52db2d3cba5d72ca6709bf1d94121bf3748801b40f6f5c$''',
    '''^8139770ea87d175f56a35466c34c7ecccb8d8a91b4ee37a25df60f5b8fc9b394$''',
    '''^0b513ad9b4924015ca0902ed079044d3ac5dbec2306f06948c10da8eb6e39f2d$''',
    '''^66be7e332c7a453332bd9d0a7f7db055f5c5ef1a06ada66d98b39fb6810c473a$''',
    '''^91a28a0b74381593a4d9469579208926afc8ad82c8839b7644359b9eba9a4b3a$''',
]

[[allowlists]]
description = "Ed25519 PUBLIC key of the throwaway Shamir lab root regalia-ceremony#128's writer was run under once, in tests/vectors/card-ceremony-record/writer-run/ (root.hex; its shares were not kept), pinned by value"
regexTarget = "secret"
regexes = [
    '''^76584946437bf4e61a99805663321c864da655197a406063af5e7da0840817da$''',
]

[[allowlists]]
description = "TPM policy DIGESTS (SHA-256 of public data, not secrets) in tests/vectors/anchor-policy-v1.json: each object class's authPolicy = PolicyAuthorize(Name(K_A), class), K_A a public test key (#361), pinned by value"
regexTarget = "secret"
regexes = [
    '''^04d0553819cd5f032d343502b7804fe1c9046082e1ab3a6c9e1e5bf946e9ce8b$''',
    '''^34f4871e4d1bcb8abfc0068742e6b0d6ecae3b70348f8eafe590f679badf3e4e$''',
    '''^7677748bb9ad8f9afd07f7d5e2d892bf00a2e50e006f919fdf719deb98397e42$''',
    '''^83fd993384f08420cc36f06df726dc38a69104cf2609cebf985f32a1ddfc5817$''',
    '''^b3bd6b94c082c63fe0797e9064aead96e23e37d5b5c5c7a3b070724d2dbc1c37$''',
    '''^c8937c2f016cda0c8d325ce7ed3d49851e45da6270d5e458ae1238ab71d7573a$''',
]
