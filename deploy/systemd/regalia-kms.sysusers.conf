# /usr/lib/sysusers.d/regalia-kms.conf: the user the KMS daemon runs as (regalia-kms.service's User= and Group=).
# No shell, no home: its state is StateDirectory=regalia-kms (0700, the unit's). The image builder installs this
# (deploy/baremetal/image/build-rootfs.sh, #61); a host set up by hand creates the same user with useradd.
u regalia-kms - "Regalia KMS daemon" /var/lib/regalia-kms /usr/sbin/nologin
