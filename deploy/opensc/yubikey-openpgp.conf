# OpenSC configuration for a KMS host that serves a YubiKey's OpenPGP applet (CONFIGURATIONS.md).
#
# OpenSC presents a YubiKey as a PIV card by default. This block gives the YubiKey 5's ATR the
# OpenPGP card driver instead, so opensc-pkcs11.so shows the applet as two tokens, "OpenPGP card
# (User PIN)" and "OpenPGP card (User PIN (sig))". Every other card keeps its own driver: a
# Nitrokey HSM 2 on the same host is still a SmartCard-HSM.
#
# WHERE IT GOES. The shipped unit starts the daemon with OPENSC_CONF=/etc/regalia-kms/opensc.conf:
# install this file there (the AppArmor profile allows it). Under that unit the daemon does NOT read
# /etc/opensc/opensc.conf, so a card_atr block left only in that file is no longer applied. A daemon
# started without OPENSC_CONF reads /etc/opensc/opensc.conf, and the block goes inside its
# `app default`.
#
# The ATR below was measured on a YubiKey 5 NFC, firmware 5.7.4 (`opensc-tool --atr`); check it on
# the card being commissioned. With a YubiKey whose ATR differs, the daemon sees only its PIV_II token, so
# a yubikey-openpgp binding to its serial (0006 then the decimal serial) finds no slot and fails closed;
# enrolment reads that serial with the openpgp driver for every card, so it does not show the mismatch.
#
# The PIV backend (yubikey-piv) does not go through OpenSC and is unaffected.
app default {
  card_atr 3b:fd:13:00:00:81:31:fe:15:80:73:c0:21:c0:57:59:75:62:69:4b:65:79:40 {
    driver = "openpgp";
  }
}
