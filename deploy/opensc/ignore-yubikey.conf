# OpenSC configuration for a KMS host whose YubiKey is served by the PIV backend (CONFIGURATIONS.md).
#
# The PIV backend opens the YubiKey for exclusive use, and opensc-pkcs11.so keeps a connection open
# to every card it finds. With OpenSC's defaults the daemon's own PKCS#11 module therefore locks the
# PIV backend out of the YubiKey: "the smart card cannot be accessed because of other connections
# outstanding" (measured, regalia#541). This tells OpenSC to leave the YubiKey's reader alone. The
# SmartCard-HSM is unaffected.
#
# Install this file as /etc/regalia-kms/opensc.conf: the shipped unit starts the daemon with
# OPENSC_CONF naming that path, and the AppArmor profile allows it. A daemon that holds both a
# PKCS#11 module and PIV cards refuses to start when a PIV card cannot be opened because another
# connection holds a reader, and the host probe (kms_opensc_leaves_piv_cards) checks the unit and
# this file beforehand.
#
# It cannot be combined with yubikey-openpgp.conf for the same card: that file asks OpenSC to drive
# the YubiKey, and this one asks it not to. One card serves PIV or the OpenPGP applet, not both.
app default {
  ignored_readers = "Yubico";
}
