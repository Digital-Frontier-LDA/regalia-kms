# STAGING IMAGE VARIANT ONLY (regalia-kms-dx7.14): the staging host's own files on /var
# 0711: traverse only, so systemd-networkd (User=systemd-network) can read network/ below it (regalia-kms-dx7.34);
# the keys and the sshd conf stay in their own 0700 directories
d /var/lib/regalia-staging 0711 root root -
d /var/lib/regalia-staging/ssh 0700 root root -
d /var/lib/regalia-staging/sshd_config.d 0700 root root -
d /var/lib/regalia-staging/network 0755 root root -
L /etc/systemd/network/10-regalia-staging.network - - - - /var/lib/regalia-staging/network/10-regalia-staging.network
