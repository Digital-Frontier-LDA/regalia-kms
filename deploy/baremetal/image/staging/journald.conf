# STAGING IMAGE VARIANT ONLY (regalia-kms-dx7.14): the journal is kept on /var (the LUKS2 volume), so a staging
# boot's units can be read after the next boot, or offline from the bench live ISO. The production image keeps
# journald's default (regalia-kms-dx7.32: volatile without /var/log/journal).
[Journal]
Storage=persistent
