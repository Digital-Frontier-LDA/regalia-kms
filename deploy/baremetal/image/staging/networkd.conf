# STAGING IMAGE VARIANT ONLY (regalia-kms-dx7.14): systemd-networkd (Debian's systemd ships it; only the staging
# variant enables it) runs only on a staging boot. Its one
# .network file is this host's, on /var (/etc/systemd/network/10-regalia-staging.network links there:
# regalia-staging.tmpfiles.conf), written by the staging install.
[Unit]
# regalia-kms-ib0: the /etc link is made by tmpfiles (After=local-fs.target), which can finish AFTER networkd has
# already read its config -- build 12 saw only lo and timed out in wait-online. Order after the tmpfiles service
# so the link exists before the config is read (the conditions above still gate the unit).
After=systemd-tmpfiles-setup.service
ConditionKernelCommandLine=regalia.staging=1
ConditionPathExists=/var/lib/regalia-staging/network/10-regalia-staging.network
