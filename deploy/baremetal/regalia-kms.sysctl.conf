# The KMS host's kernel settings (#61, regalia-kms-r1s.5). The image installs this file as
# /usr/lib/sysctl.d/90-regalia-kms.conf (deploy/baremetal/image/build-rootfs.sh). It is under /usr, so dm-verity
# covers it, and systemd-sysctl applies it at every boot. It sorts after the distribution's own files, so for any key
# both set, this file's value wins. A same-named file in /etc/sysctl.d would replace it, but /etc is the factory copy
# on the verity host (etc-inventory.txt).
# os_probe.py's kernel_sysctl_baseline reads every value below from /proc/sys on the running host, and fails on any
# value that differs. os_probe.SYSCTL_BASELINE holds the same settings, and a test (tests/test_baremetal_os_probe.py)
# holds the two together. A setting changed here must change there too.
# Reasons are given per setting. Each one is one of these: the KMS host runs one service and a few helpers, never
# routes, and no untrusted local user should ever reach a shell on it.

# --- what an unprivileged process can learn about the kernel
# Kernel pointers are hidden from everyone, root included, in /proc and in printk's %pK. They are what an exploit needs
# to get past KASLR.
kernel.kptr_restrict = 2
# Only CAP_SYSLOG reads the kernel log. It can hold addresses and the traces of a failed exploit.
kernel.dmesg_restrict = 1
# perf events are for CAP_PERFMON only (Debian's level 3). An unprivileged perf_event_open is a large kernel attack
# surface, and its side channels can reach key material.
kernel.perf_event_paranoid = 3

# --- what an unprivileged process can do to the kernel
# Nobody may load a new kernel from the running one. A kexec skips the firmware and the signed UKI, does not reset the
# TPM, and the peers refuse what it boots anyway (README: a kexec always ends at the recovery-key prompt). This
# setting cannot be undone until the next boot.
kernel.kexec_load_disabled = 1
# Unprivileged eBPF is off for good (1: it cannot be set back without a reboot). Debian's 2 can be lowered again by root.
kernel.unprivileged_bpf_disabled = 1
# The BPF JIT blinds constants for every program, root's included: JIT spraying.
net.core.bpf_jit_harden = 2
# userfaultfd is for CAP_SYS_PTRACE only. Unprivileged, it stretches the kernel's race windows for an exploit.
vm.unprivileged_userfaultfd = 0
# A user cannot make the kernel autoload a TTY line discipline module (the n_hdlc and n_gsm CVEs).
dev.tty.ldisc_autoload = 0
# The magic SysRq key is off. A console key could otherwise kill every process, remount filesystems or reboot without
# a clean shutdown. A hung host is reset from its BMC instead.
kernel.sysrq = 0
# Full address-space randomisation: stack, mmap, vDSO and heap.
kernel.randomize_va_space = 2

# --- one process reading another
# Only CAP_SYS_PTRACE may attach to a process, and the KMS daemon holds no capability (os_probe kms_capabilities_minimal).
# Yama's default (1) still lets a process attach to its own descendants. 3 would also lock root out until a reboot,
# which leaves no way to debug a live host.
kernel.yama.ptrace_scope = 2
# A setuid or capability-raised process leaves no core dump. os_probe's core_dumps_disabled measures this one, not
# kernel_sysctl_baseline (os_probe.SYSCTL_MEASURED_ELSEWHERE).
fs.suid_dumpable = 0

# --- files in shared directories (/tmp, /var/tmp, /run): the classic local races
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# --- the network. The host is an endpoint and never a router. Its WireGuard interfaces end on the host, and
# nftables (firewall.py) decides what comes in.
# It forwards nothing. No interface on it is a path to another network.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
# SETTINGS PER INTERFACE ARE WRITTEN WITH "*": they then reach "all", "default" and every interface that already
# exists, and systemd's udev rule applies them again to each interface added later (sysctl.d(5), systemd 257). "all"
# and "default" alone are not enough. An interface made before this file is applied keeps the value it was made with.
# With forwarding off, the kernel enables accept_redirects, secure_redirects and send_redirects if all OR the
# interface says so, and takes the larger of the two rp_filter values (2, loose, beats 1, strict). IPv6 reads each
# interface's own value. kernel_sysctl_baseline measures every interface listed under /proc/sys/net/ipv{4,6}/conf.
# A packet is accepted only on the interface the host would answer it through (strict reverse-path filter, IPv4).
# Each tunnel's peers are routed through that tunnel, and the underlay through the uplink.
net.ipv4.conf.*.rp_filter = 1
# An ICMP redirect does not change the host's routes, and the host sends none (it is not a router).
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.*.secure_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
net.ipv4.conf.*.send_redirects = 0
# A packet does not choose its own route.
net.ipv4.conf.*.accept_source_route = 0
net.ipv6.conf.*.accept_source_route = 0
# A SYN flood does not fill the listen queue of the KMS port or the sync port.
net.ipv4.tcp_syncookies = 1
# A broadcast ping gets no answer: the host takes no part in a smurf amplification.
net.ipv4.icmp_echo_ignore_broadcasts = 1
