# /usr/lib/tmpfiles.d/regalia-authority.conf, on the authority host only (#71): what its regalia-authority-authtime
# needs, as regalia.tmpfiles.conf makes it on a node: root's /run/regalia (authtime.json, believed only from a
# root-owned directory), the time trail and the chrony latch (#303), and authtime's node_exporter directory (#305).
d /run/regalia 0755 root root -
d /var/log/regalia-time 0750 root regalia-audit-time -
d /var/lib/regalia-time 0700 root root -
d /run/regalia-metrics 0755 root root -
d /run/regalia-metrics/authtime 2750 root regalia-metrics -
