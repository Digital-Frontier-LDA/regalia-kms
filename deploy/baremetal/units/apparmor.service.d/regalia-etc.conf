# /usr/lib/systemd/system/apparmor.service.d/regalia-etc.conf (#61): the profiles are read from /etc/apparmor.d, which
# is empty until it has been copied from /usr/share/factory/etc (regalia-etc-factory.service). Requires=, not Wants=
# (#723 review): a FAILED copy fails this job, so apparmor never loads an empty or stale /etc/apparmor.d, and
# regalia-kms.service, which requires apparmor.service and its profile (regalia-kms.service.d/apparmor.conf), does not
# start at all.
# And after the full tmpfiles pass, which empties its cache (00-regalia-etc.conf: D /var/cache/apparmor), so a cache
# compiled from another image's profiles is never loaded.
[Unit]
Requires=regalia-etc-factory.service
After=regalia-etc-factory.service systemd-tmpfiles-setup.service
