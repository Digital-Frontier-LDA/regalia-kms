# /usr/lib/systemd/system/apparmor.service.d/regalia-etc.conf (#61): the profiles are read from /etc/apparmor.d, which
# is empty until it has been copied from /usr/share/factory/etc (regalia-etc-factory.service). Requires=, not Wants=
# (#723 review): a FAILED copy fails this job, so apparmor never loads an empty or stale /etc/apparmor.d, and
# regalia-kms.service, which requires apparmor.service and its profile (regalia-kms.service.d/apparmor.conf), does not
# start at all.
# The CACHE: apparmor_parser loads a cached profile whenever the cache file is newer than the profile, so a cache
# compiled from another image's profiles must never be loaded. apparmor.service empties it itself, as the first step of
# its own start (ExecStartPre=, the D /var/cache/apparmor line of 00-regalia-etc.conf and nothing else): a clear that
# FAILS fails apparmor.service, and so the KMS that requires it, for exactly this case. Not Requires= on
# systemd-tmpfiles-setup.service: any unrelated tmpfiles line failing would then stop the KMS too (#723 review).
# Ordered after that full pass, which also empties it, only so the two never race on the directory.
[Unit]
Requires=regalia-etc-factory.service
After=regalia-etc-factory.service systemd-tmpfiles-setup.service

[Service]
ExecStartPre=/usr/bin/systemd-tmpfiles --create --remove --prefix=/var/cache/apparmor /usr/lib/tmpfiles.d/00-regalia-etc.conf
