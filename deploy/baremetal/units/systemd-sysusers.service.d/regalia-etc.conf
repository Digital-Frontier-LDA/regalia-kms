# /usr/lib/systemd/system/systemd-sysusers.service.d/regalia-etc.conf (#61): the image's /etc, accounts included, is
# copied from /usr/share/factory/etc BEFORE sysusers looks, so it allocates nothing and the image's UIDs and GIDs
# survive (regalia-etc-factory.service; e2e/etc-factory.sh shows the other order losing them).
# Requires=, not Wants=: a copy that FAILED (or whose factory tree is missing: the unit's AssertPathIsDirectory=) fails
# this job, so sysusers never runs on an empty /etc. With Wants= it would, allocating the image's users again at other
# IDs, and the copy cannot repair that later (C+ never replaces a file): #723 review.
[Unit]
Requires=regalia-etc-factory.service
After=regalia-etc-factory.service
