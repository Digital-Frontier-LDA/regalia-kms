# /usr/lib/systemd/system/regalia-kms.service.d/apparmor.conf (#61, #723 review): the image's KMS runs under its
# AppArmor profile or not at all. Each line closes one way it could otherwise start unconfined:
# - AppArmorProfile= with no "-" prefix: systemd refuses to start the service (231/APPARMOR) when the profile named
#   regalia-kms (deploy/baremetal/apparmor/usr.sbin.regalia-kms, a named profile, attached to no path) is not loaded.
# - AssertSecurity=apparmor: with AppArmor off in the kernel, systemd SKIPS AppArmorProfile= and the service would run
#   unconfined. The assert fails the start instead (a Condition would skip it, which counts as success).
# - Requires= + After=apparmor.service: the profiles are loaded first, and only from a successful /etc copy
#   (apparmor.service.d/regalia-etc.conf: Requires=regalia-etc-factory.service). It also pulls apparmor.service in
#   on the image, where its own enablement in /etc/systemd/system is not seen by PID 1 (etc-inventory.txt).
[Unit]
Requires=apparmor.service
After=apparmor.service
AssertSecurity=apparmor

[Service]
AppArmorProfile=regalia-kms
