# /usr/lib/systemd/system/regalia-kms.service.d/memlock.conf (regalia-kms-r1s.8): the daemon locks its PIN pages, within
# this limit (deploy/systemd/regalia-kms-credentials.conf.example sets the same on a host that is not the image). The
# PIN credentials themselves are this host's: the image's generator reads them from the /var credstore at every boot
# (deploy/baremetal/generators/regalia-kms-credentials).
[Service]
LimitMEMLOCK=1M
