# /usr/lib/systemd/system/regalia-kms.service.d/10-restore-pending.conf (regalia-kms-dx7.26): the daemon stays SKIPPED at
# every boot while /etc/regalia/restore-pending is there, as etcd does (regalia-etcd.service.d/10-restore-pending.conf):
# a single-node host with no live etcd history must not serve before a restore has raised the state epoch. A condition,
# not an assertion: the unit reads skipped, not failed. Nothing lifts it for the daemon but the marker's removal, by the
# restore's exchange (deploy/baremetal/restore.py), after which the restore starts it on the raised epoch only.
[Unit]
ConditionPathExists=!/etc/regalia/restore-pending
