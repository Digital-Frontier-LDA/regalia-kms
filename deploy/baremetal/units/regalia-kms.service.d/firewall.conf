# /usr/lib/systemd/system/regalia-kms.service.d/firewall.conf (regalia-kms-r1s.8): the KMS starts behind this host's
# firewall or not at all. Each line closes one way it could otherwise serve with no firewall:
# - Requires= + After=nftables.service: the ruleset is loaded first, and a ruleset that fails to load fails the KMS.
# - AssertPathExists=: nftables.service is SKIPPED (its ConditionPathExists=, nftables.service.d/regalia.conf) on a host
#   with no ruleset, and a skip counts as success for Requires=: the assert fails the start instead, by name.
# - ExecStartPre=+nft list table: the table firewall.py renders (firewall.TABLE) is loaded in the kernel now, whatever
#   the files say (a ruleset flushed by hand, an include that named another file). "+": nft needs CAP_NET_ADMIN, which
#   the daemon never has; the check runs as root, outside the sandbox, and the daemon's own process is unchanged.
[Unit]
Requires=nftables.service
After=nftables.service
AssertPathExists=/etc/nftables.d/regalia-kms.nft

[Service]
ExecStartPre=+/usr/sbin/nft --terse list table inet regalia_kms
