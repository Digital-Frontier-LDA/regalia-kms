# /usr/lib/systemd/system/regalia-etcd.service.d/10-restore-pending.conf (regalia-kms-dx7.26): a single-node host with no
# live etcd history (a replacement disk, or a lost-disk restore under way) holds etcd SKIPPED at every boot. Started on an
# empty data directory, etcd would form a new, empty one-member cluster (initial-cluster-state new) and the daemon would
# serve on it at state epoch 0. The marker, /etc/regalia/restore-pending, persists (/etc/regalia links to /var): enrol
# commit writes it for a single-node replacement (not at genesis, --bootstrap), restore.py run before it stops anything
# when there is no live store, and `restore mark-pending` by hand; restore.py removes it once the restored store holding
# the raised state epoch is exchanged into place. restore.py's own drop-in, /run/.../50-restore.conf, resets the
# conditions to run etcd on its staging store: drop-ins are read in FILE-NAME order whatever their directory, so this one
# is named to sort BEFORE it (10- < 50-), or the marker would come back after the reset.
[Unit]
ConditionPathExists=!/etc/regalia/restore-pending
