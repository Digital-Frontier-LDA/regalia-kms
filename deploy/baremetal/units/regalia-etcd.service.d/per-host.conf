# /usr/lib/systemd/system/regalia-etcd.service.d/per-host.conf (regalia-kms-r1s.8): regalia-etcd.service starts on an ENROLLED node only.
# The image enables it under /usr (deploy/baremetal/image/units-enabled.txt, [per-host]): / is a tmpfs and /etc is made
# from the image at every boot, so an operator's `systemctl enable` would be gone at the next boot. Whether THIS host
# runs it is per-host state, read here: node.json, which enrolment's commit writes (enrol.py, by its /var name; /etc/regalia
# links to /var/lib/regalia-etc/regalia). Before enrolment the unit is skipped; once it is there, every boot starts it.
[Unit]
ConditionPathExists=/etc/regalia/node.json
