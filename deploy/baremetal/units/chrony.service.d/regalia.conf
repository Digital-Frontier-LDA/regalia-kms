# chronyd runs from the configuration enrolment renders from the site's time.nts (#303, deploy/baremetal/
# authtime.conf): NTS only, two agreeing sources, no pool, sourcedir or refclock. Installed as
# /etc/systemd/system/chrony.service.d/regalia.conf. The configuration is /etc/chrony/regalia.conf, a
# file of its own: Debian's /etc/chrony/chrony.conf is a package conffile and is never touched, and
# /etc/chrony is where the distribution's AppArmor profile lets chronyd read. Without that file chronyd
# does not start, and time is not authenticated (authtime.py): fail closed until enrolment has run.
#
# No Restart=, as the distribution's unit: when chronyd exits on `maxchange` (two sources agreeing on a
# jump after boot) it stays down, and an operator looks at why before it steps the clock again.
[Unit]
# chronyd must be the only thing that sets the clock (authtime.py's host control)
Conflicts=systemd-timesyncd.service

[Service]
ExecStart=
ExecStart=!/usr/sbin/chronyd -f /etc/chrony/regalia.conf $DAEMON_OPTS
