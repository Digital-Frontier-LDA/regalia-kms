# chronyd runs from the configuration enrolment renders from the site's time.nts (#303, deploy/baremetal/
# authtime.conf): NTS only, two agreeing sources, no pool, sourcedir or refclock. Installed as
# /etc/systemd/system/chrony.service.d/regalia.conf. The configuration is /etc/chrony/regalia.conf, a
# file of its own: Debian's /etc/chrony/chrony.conf is a package conffile and is never touched, and
# /etc/chrony is where the distribution's AppArmor profile lets chronyd read. Until enrolment has written
# it, the unit is skipped (ConditionPathExists), and time is not authenticated (authtime.py).
#
# THE LATCH (#303, regalia-kms-d9 and -24). When chronyd stops with any result but a clean stop (maxchange:
# two sources agreeing on a jump after boot; a crash; a kill), ExecStopPost records it in root's
# /var/lib/regalia-time/chrony-latch, which survives a reboot, and ExecStartPre refuses to start chronyd while
# it is there. So the package upgrade's restart (its postinst restarts chrony), a manual start and a reboot all
# leave chronyd stopped: a fresh chronyd steps to whatever two sources agree on during its first updates. An
# operator compares the declared servers with an independent clock, runs
# `regalia-node time-clear --reason TEXT` (recorded in the time trail), then `systemctl start chrony`. The
# directory is root's 0700 (regalia.tmpfiles.conf), never chrony's: chronyd parses the network as _chrony
# and must not be able to remove the latch. Without the directory chronyd is not started either. With the
# directory there but the write failing (a full or read-only /var), no latch is written and the next start
# proceeds: the trade taken, because the inverse (a marker armed at every start) would strand every node
# after a power cut (regalia-kms-d9). A stop that needs SIGKILL (SERVICE_RESULT=timeout, at a shutdown)
# latches too: it fails closed, and the operator clears it as above.
[Unit]
ConditionPathExists=/etc/chrony/regalia.conf
# chronyd must be the only thing that sets the clock (authtime.py's host control)
Conflicts=systemd-timesyncd.service

[Service]
ReadWritePaths=/var/lib/regalia-time
ExecStartPre=!/bin/sh -c 'if [ ! -d /var/lib/regalia-time ]; then echo "regalia: /var/lib/regalia-time is missing (systemd-tmpfiles --create): chronyd is not started" >&2; exit 1; fi; if [ -e /var/lib/regalia-time/chrony-latch ]; then echo "regalia: chronyd stopped abnormally before ($$(cat /var/lib/regalia-time/chrony-latch)) and is not started again until an operator has compared the time servers with an independent clock and run: regalia-node time-clear --reason TEXT" >&2; exit 1; fi'
ExecStart=
ExecStart=!/usr/sbin/chronyd -f /etc/chrony/regalia.conf $DAEMON_OPTS
ExecStopPost=!/bin/sh -c 'if [ "$$SERVICE_RESULT" != success ] && [ -d /var/lib/regalia-time ]; then set -C; { printf "{\\"at\\": \\"%%s\\", \\"result\\": \\"%%s\\", \\"exit_code\\": \\"%%s\\", \\"exit_status\\": \\"%%s\\"}\\n" "$$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)" "$$SERVICE_RESULT" "$$EXIT_CODE" "$$EXIT_STATUS" > /var/lib/regalia-time/chrony-latch; } 2>/dev/null || true; fi'
