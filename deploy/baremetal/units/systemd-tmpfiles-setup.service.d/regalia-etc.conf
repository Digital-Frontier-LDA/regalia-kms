# /usr/lib/systemd/system/systemd-tmpfiles-setup.service.d/regalia-etc.conf (#61): the full tmpfiles pass, which makes
# regalia-etc.conf's /var directories, runs after /etc has been made from the factory copy (regalia-etc-factory.service),
# and only after a SUCCESSFUL copy (Requires=, #723 review): on an empty /etc it would apply none of the image's
# /etc/tmpfiles.d, and the AppArmor cache it empties is what apparmor.service loads next.
[Unit]
Requires=regalia-etc-factory.service
After=regalia-etc-factory.service
