# /usr/lib/systemd/system/regalia-audit-ship@.service.d/per-host.conf (regalia-kms-r1s.8): every instance, one per trail
# in deploy/baremetal/trails.py's registry, is enabled by the image under /usr (deploy/baremetal/image/units-enabled.txt,
# [per-host]), and starts once THIS host has its collector configuration: /etc/regalia/audit-ship.env (AUDIT-COLLECTOR.md;
# /etc/regalia links to /var). Without it the instances are skipped; an enrolled node with no shipper running raises
# RegaliaAuditShipMetricsMissing (deploy/monitoring). With it, a broken configuration still fails each start by name
# (the unit's ExecStartPre= check), never silently.
[Unit]
ConditionPathExists=/etc/regalia/audit-ship.env
