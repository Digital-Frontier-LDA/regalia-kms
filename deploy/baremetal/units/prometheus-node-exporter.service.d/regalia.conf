# The image's, as /usr/lib/systemd/system/prometheus-node-exporter.service.d/regalia.conf (#305): node_exporter reads
# the writers' textfile directories (/run/regalia-metrics/<writer>, 2750, group regalia-metrics) through the
# group, given to its unit here rather than to its user, so Debian's package keeps owning the prometheus user
# (regalia-kms-24). The group comes from regalia.sysusers.conf (and regalia-audit-ship.sysusers.conf).
#
# ConditionPathExists=: the image replaces the package's /etc/default/prometheus-node-exporter with a tmpfiles link
# to /var/lib/regalia-etc (00-regalia-etc.tmpfiles.conf), written by the operator from the site configuration
# (MONITORING.md). Until it is, the enabled unit failed every start with "Failed to load environment files" and hit
# the start limit (staging DL360 build 8; regalia-kms-r1s.17). The gate is the PERSISTENT /var name, not /etc's link:
# the link is always present (the factory copy), so a guard on /etc would start the exporter on the package's own
# arguments (every address, no TLS) on an unconfigured node. r1s.16's refusal stands: node_exporter never runs on
# the package default. A host configured after the guard first skips starts it explicitly (or reboots): nothing
# watches the /var name for it.
[Unit]
ConditionPathExists=/var/lib/regalia-etc/default/prometheus-node-exporter

[Service]
SupplementaryGroups=regalia-metrics
