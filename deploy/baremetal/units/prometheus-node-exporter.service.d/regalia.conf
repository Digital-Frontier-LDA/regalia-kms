# Installed as /etc/systemd/system/prometheus-node-exporter.service.d/regalia.conf (#305): node_exporter reads
# the writers' textfile directories (/run/regalia-metrics/<writer>, 2750, group regalia-metrics) through the
# group, given to its unit here rather than to its user, so Debian's package keeps owning the prometheus user
# (regalia-kms-24). The group comes from regalia.sysusers.conf (and regalia-audit-ship.sysusers.conf).
[Service]
SupplementaryGroups=regalia-metrics
