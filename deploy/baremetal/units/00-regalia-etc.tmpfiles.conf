# /usr/lib/tmpfiles.d/00-regalia-etc.conf: /etc made from the image, and this host's own files kept on /var (#61, the
# dm-verity design of 2026-10-05). / is a tmpfs, so /etc starts EMPTY at every boot; /usr is the read-only verity
# image and holds the image's /etc as /usr/share/factory/etc (build-rootfs.sh); /var is this host's LUKS2 volume.
# The inventory of what is per host, and why each line is here: deploy/baremetal/image/etc-inventory.txt. Held to it,
# and to deploy/baremetal/hostpaths.py, by tests/test_baremetal_etc_inventory.py.
#
# TWO PASSES over this one file:
#   /etc   regalia-etc-factory.service, `systemd-tmpfiles --create --boot --prefix=/etc`, BEFORE systemd-sysusers: the
#          image's /etc/passwd, group, shadow and gshadow are in place when sysusers looks, so it finds every account
#          the image allocated and allocates nothing (the image's UIDs and GIDs survive; on an empty /etc it would
#          allocate them anew, in another order: e2e/etc-factory.sh shows both)
#   /var   systemd-tmpfiles-setup.service, after local-fs.target: the per-host directories the links point into,
#          the machine ID kept, the AppArmor cache emptied
#
# 00-: systemd-tmpfiles applies, for a path two files name, the line of the file whose name sorts first. Two of these
# paths systemd itself names (measured on Debian 13's systemd 257): credstore.conf `d /etc/credstore.encrypted` and
# dbus.conf `L /var/lib/dbus/machine-id -> /etc/machine-id`. This file's lines are the ones applied.
#
# C+: copy the factory tree into /etc, descending into directories that already exist and never replacing a file
# that is there (PID 1 has written /etc/machine-id by then). It is the first line by path, so every link below is made
# after the copy.
C+ /etc - - - -

# THIS HOST'S FILES: /etc names kept for every reader, the files on /var. A writer writes the /var name
# (hostpaths.persistent), never the link: tests/test_baremetal_etc_writes.py refuses a write by the /etc name.
# The node's configuration: node.json, the site configuration, the WG-SERVICE key, etcd.conf.yml and its certificates,
# the audit shipper's and node_exporter's certificates
L /etc/regalia - - - - /var/lib/regalia-etc/regalia
# the KMS daemon's configuration (config.json, opensc.conf)
L /etc/regalia-kms - - - - /var/lib/regalia-etc/regalia-kms
# the TPM-sealed credentials: the PINs (seal-hsm-pin.sh), etcd's peer key. L+: systemd ships an empty
# /etc/credstore.encrypted (0700), so the factory copy holds one and the link replaces it
L+ /etc/credstore.encrypted - - - - /var/lib/regalia-etc/credstore.encrypted
# chronyd -f (units/chrony.service.d/regalia.conf), rendered at enrolment from the site's NTS servers
L /etc/chrony/regalia.conf - - - - /var/lib/regalia-etc/chrony/regalia.conf
# the SSH host key the manifest names (ssh_host_pub): it must outlive a reboot
L /etc/ssh/ssh_host_ed25519_key - - - - /var/lib/regalia-etc/ssh/ssh_host_ed25519_key
L /etc/ssh/ssh_host_ed25519_key.pub - - - - /var/lib/regalia-etc/ssh/ssh_host_ed25519_key.pub
# the host firewall's ruleset, rendered per host (firewall.py)
L /etc/nftables.d/regalia-kms.nft - - - - /var/lib/regalia-etc/nftables.d/regalia-kms.nft
# node_exporter's ARGS (metrics.py node-exporter-args): L+, since the package's own file is in the factory copy
L+ /etc/default/prometheus-node-exporter - - - - /var/lib/regalia-etc/default/prometheus-node-exporter

# the directories those links point into, made by the /var pass (root's; the credstore closed to everyone else)
d /var/lib/regalia-etc 0755 root root -
d /var/lib/regalia-etc/regalia 0755 root root -
d /var/lib/regalia-etc/regalia-kms 0755 root root -
d /var/lib/regalia-etc/credstore.encrypted 0700 root root -
d /var/lib/regalia-etc/chrony 0755 root root -
d /var/lib/regalia-etc/ssh 0755 root root -
d /var/lib/regalia-etc/nftables.d 0755 root root -
d /var/lib/regalia-etc/default 0755 root root -

# THE MACHINE ID, on /var (etc-inventory.txt [boot]): PID 1 reads /var/lib/dbus/machine-id when /etc/machine-id is
# missing or empty (machine-id(5), systemd 257), and /var is mounted by the initrd. At the first boot PID 1 makes an ID
# (random on bare metal) into /etc; this copies it, once, to /var, where every later boot finds it. Not
# systemd.machine_id=: the command line is the signed UKI's, the same on every host and measured into PCR 11.
C /var/lib/dbus/machine-id - - - - /etc/machine-id

# THE APPARMOR CACHE, emptied at every boot (D, with systemd-tmpfiles-setup's --remove): apparmor_parser loads a cached
# profile whenever the cache file is NEWER than the profile (apparmor_parser(8)), and the image's profiles carry the
# build's clamped mtime (the factory copy keeps it: e2e/etc-factory.sh). After an A/B update with a changed profile, the
# old image's cache would win. apparmor.service runs after this pass (units/apparmor.service.d/regalia-etc.conf).
D /var/cache/apparmor 0755 root root -

# chronyd's AppArmor profile reads /etc/chrony/** and, through its local include, what that names: it resolves the
# /etc/chrony/regalia.conf link and reads the /var file. The include is the image's own (deploy/baremetal/apparmor/local),
# linked over the empty one the chrony package ships (L+)
L+ /etc/apparmor.d/local/usr.sbin.chronyd - - - - /usr/lib/regalia-kms/deploy/baremetal/apparmor/local/usr.sbin.chronyd
