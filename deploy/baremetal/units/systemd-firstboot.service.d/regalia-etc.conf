# /usr/lib/systemd/system/systemd-firstboot.service.d/regalia-etc.conf (#61 K61V-4). Every boot is a first boot on the
# verity host (/etc starts empty: ConditionFirstBoot holds), so systemd-firstboot runs at every boot. MEASURED on the
# first local verity boots: with the factory /etc copied it asks nothing, but on an image whose copy failed it ran on
# the empty /etc and stopped the boot at the console ("Please configure your system! -- Press any key to proceed --").
# - Requires= + After= the copy, as the other consumers of /etc: with no copy it does not run (its After= on
#   systemd-sysusers orders it, but does not stop it when sysusers' own dependency failed).
# - No --prompt-*: the host is never configured at its console; the image's locale, keymap, time zone and accounts
#   are the factory copy's. A host whose /etc lacked one runs on systemd's default, rather than waiting for a key.
[Unit]
Requires=regalia-etc-factory.service
After=regalia-etc-factory.service

[Service]
ExecStart=
ExecStart=systemd-firstboot
