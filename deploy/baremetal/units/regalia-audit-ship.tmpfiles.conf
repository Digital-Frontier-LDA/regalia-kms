# /usr/lib/tmpfiles.d/regalia-audit-ship.conf: the shipper's node_exporter textfile directory (#305,
# deploy/baremetal/metrics.py), on the nodes and on the authority host: the shipper's own, group
# regalia-metrics, setgid; node_exporter reads <trail>.prom there through the group.
d /run/regalia-metrics 0755 root root -
d /run/regalia-metrics/audit-ship 2750 regalia-audit-ship regalia-metrics -
