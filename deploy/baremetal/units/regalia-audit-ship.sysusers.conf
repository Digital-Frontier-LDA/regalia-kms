# The audit trail shipper (#278, regalia-audit-ship@.service), on the nodes and on the authority host. It
# reads each trail through that trail's group, given per instance (regalia-audit-ship@<trail>.service.d),
# and holds no capability. regalia-audit is the group of the operator tools' trails (/var/log/regalia,
# root:regalia-audit 2750, made by deploy/baremetal/trails.py).
g regalia-audit -
u regalia-audit-ship - "Regalia KMS audit trail shipper" /var/lib/regalia-audit-ship /usr/sbin/nologin
# #305: node_exporter reads the shipper's metrics through regalia-metrics (also in regalia.sysusers.conf on a
# node), joined by node_exporter's unit drop-in, so the package keeps its own user
g regalia-metrics -
