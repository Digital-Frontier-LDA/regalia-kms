# /usr/lib/systemd/system/regalia-audit-prune@.timer.d/per-host.conf (regalia-kms-r1s.8): the daily prune of each trail,
# enabled by the image under /usr (deploy/baremetal/image/units-enabled.txt, [per-host]) and armed once THIS host has its
# collector configuration (/etc/regalia/audit-ship.env, on /var), as its shipper (regalia-audit-ship@.service.d/per-host.conf).
[Unit]
ConditionPathExists=/etc/regalia/audit-ship.env
