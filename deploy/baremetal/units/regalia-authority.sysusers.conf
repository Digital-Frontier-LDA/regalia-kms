# /usr/lib/sysusers.d/regalia-authority.conf, on the authority host only: the user the authority runs as.
u regalia-authority - "Regalia KMS revocation authority" /var/lib/regalia-authority /usr/sbin/nologin
# the reader group of the authority's audit trail (#286): the authority and regalia-audit-ship@authority
g regalia-audit-authority -
# its regalia-authority-authtime (#71): the time trail's reader group (#303) and node_exporter's (#305), as on a node
g regalia-audit-time -
g regalia-metrics -
