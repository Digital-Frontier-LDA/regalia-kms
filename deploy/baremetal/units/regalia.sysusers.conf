# /usr/lib/sysusers.d/regalia.conf: the users regalia-sync and regalia-admission run as. No shell, no home.
u regalia-sync - "Regalia KMS three-site transport" /var/lib/regalia-sync /usr/sbin/nologin
# the user regalia-admission runs as (#191): the runtime lease and the admission file. The TPM through the
# tss group (the unit's SupplementaryGroups=), nothing else.
u regalia-admission - "Regalia KMS runtime admission" /var/lib/regalia-admission /usr/sbin/nologin
# the user etcd runs as (ADR-0002 D32, regalia-etcd.service): its data directory, its socket, nothing else
u regalia-etcd - "Regalia KMS operational-state store (etcd)" /var/lib/regalia-etcd /usr/sbin/nologin
# the group that may connect to etcd's client socket (/run/regalia-etcd): a client's unit joins it by
# SupplementaryGroups=; no member yet (the watcher and the gate are #432's build)
g regalia-etcd-client -
# the reader groups of the node's audit trails (#286): the writer and its regalia-audit-ship@ instance, nothing else
g regalia-audit-sync -
g regalia-audit-admission -
g regalia-audit-time -
# #305: the group node_exporter reads the textfile directories through, joined by node_exporter's unit
# (units/prometheus-node-exporter.service.d/regalia.conf), so the package keeps its own user
g regalia-metrics -
