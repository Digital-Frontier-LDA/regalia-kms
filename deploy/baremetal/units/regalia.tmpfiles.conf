# /usr/lib/tmpfiles.d/regalia.conf: root's directory, where the unlock client (or
# regalia-boot-session.service) leaves the boot session, and the lease service's directory inside it,
# which the KMS daemon reads. /run/regalia is made here on a boot where the unlock client did not run
# (the disk opened with the recovery key); neither is removed while the system runs.
d /run/regalia 0755 root root -
# The lease service's own directory (#191): the admission file and its request record. That user may
# replace what is in it and nothing else in /run/regalia; the KMS daemon reads the file from it.
d /run/regalia/admission 0755 regalia-admission regalia-admission -
# #303: the time trail (regalia-authtime's transitions, each clear of the chrony latch), root's, read by its
# shipper's group; and root's own directory for the latch that keeps chronyd stopped after an abnormal exit
# (deploy/baremetal/authtime.py, units/chrony.service.d/regalia.conf). Both survive a reboot.
d /var/log/regalia-time 0750 root regalia-audit-time -
d /var/lib/regalia-time 0700 root root -
# #66 B3: the ESP advance's trail (each run before the TPM anchor moves, and each refusal), root's, read by its shipper's group
d /var/log/regalia-esp-advance 0750 root regalia-audit-esp-advances -
# #305: node_exporter's textfile directories, one per writer (deploy/baremetal/metrics.py): the writer's own,
# group regalia-metrics, setgid so each file takes the group; node_exporter's user is the group's only other
# member and reads, never writes. node_exporter reads them all as /run/regalia-metrics/*.
d /run/regalia-metrics 0755 root root -
d /run/regalia-metrics/authtime 2750 root regalia-metrics -
d /run/regalia-metrics/sync 2750 regalia-sync regalia-metrics -
d /run/regalia-metrics/admission 2750 regalia-admission regalia-metrics -
d /run/regalia-metrics/esp-advance 2750 root regalia-metrics -
# the audit shipper's, on the nodes: regalia-audit-ship.tmpfiles.conf
