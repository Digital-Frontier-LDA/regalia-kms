# /usr/lib/systemd/system/nftables.service.d/regalia.conf (regalia-kms-r1s.8): the host firewall, loaded at every boot.
# The image enables nftables.service under /usr (deploy/baremetal/image/units-enabled.txt, [per-host]) and its
# /etc/nftables.conf (build-rootfs.sh, in the factory copy) is `flush ruleset` and an include of THIS host's ruleset,
# /etc/nftables.d/regalia-kms.nft, a link to /var/lib/regalia-etc/nftables.d (firewall.py renders it; README.md).
# - ConditionPathExists=: a host with no ruleset yet (before enrolment) skips it. That alone would be a host with NO
#   firewall: regalia-kms.service refuses to start then (regalia-kms.service.d/firewall.conf: it asserts the ruleset
#   is there and that the table is loaded), so the KMS never serves unprotected.
# - Requires= + After=regalia-etc-factory.service: nftables.conf and the link are made by the /etc copy; Debian's unit
#   has DefaultDependencies=no and would otherwise run on an empty /etc. A failed copy fails the firewall, and the KMS.
[Unit]
ConditionPathExists=/etc/nftables.d/regalia-kms.nft
Requires=regalia-etc-factory.service
After=regalia-etc-factory.service
