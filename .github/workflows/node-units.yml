# regalia-kms#80, step 3b: the node's four units under the runner's real systemd. It changes the machine
# (a kernel module, the system chrony and clock, a user, units), so it runs only here, and only when
# what it tests changes. Not a required check: the paths filter means it does not report on other PRs.
name: node units

on:
  pull_request:
    paths:
      - deploy/baremetal/**
      - e2e/node-units-systemd.py
      - .github/workflows/node-units.yml
      - internal/admission/**
      - internal/config/**
      - cmd/regalia-kms/**
      - cmd/regalia-audit-collector/**
      - cmd/regalia-audit-ship/**
      - internal/audit/**
      - e2e/audit-ship-systemd.py
      - e2e/three-node-netns.py
      - e2e/three-node-recovery.py
      - e2e/three-node-outage.py
      - cmd/regalia-unlock/**
      - e2e/lib/threenode.py
  push:
    branches: [main]
    paths:
      - deploy/baremetal/**
      - e2e/node-units-systemd.py
      - .github/workflows/node-units.yml
      - internal/admission/**
      - internal/config/**
      - cmd/regalia-kms/**
      - cmd/regalia-audit-collector/**
      - cmd/regalia-audit-ship/**
      - internal/audit/**
      - e2e/audit-ship-systemd.py
      - e2e/three-node-netns.py
      - e2e/three-node-recovery.py
      - e2e/three-node-outage.py
      - cmd/regalia-unlock/**
      - e2e/lib/threenode.py

permissions:
  contents: read

jobs:
  node-units-systemd:
    runs-on: ubuntu-24.04     # pinned: the chrony and systemd behaviour observed is 24.04's
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the software TPM, chrony and WireGuard tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools chrony wireguard-tools iproute2 \
            openssl python3-cryptography softhsm2 opensc libpcsclite-dev tpm2-abrmd libtss2-tcti-tabrmd0
          # tpm-udev: the tss group and its rule for /dev/tpmrm*. The runner's Azure kernel has no vTPM proxy
          # (CONFIG_TCG_VTPM_PROXY is not set), so the test makes the device with swtpm's CUSE mode.
          sudo apt-get install -y -qq --no-install-recommends tpm-udev
      - name: swtpm with its CUSE interface (Ubuntu builds it without; rebuilt from Ubuntu's own source package)
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq
          sudo apt-get build-dep -y -qq swtpm
          sudo apt-get install -y -qq --no-install-recommends libfuse-dev libfuse3-dev pkg-config
          cd "$RUNNER_TEMP" && apt-get source -qq swtpm && cd swtpm-*/
          [ -x configure ] || autoreconf -fi
          ./configure -q --prefix=/usr/local --with-cuse --with-openssl
          make -s -j"$(nproc)"
          sudo make -s install
          sudo ldconfig
          /usr/local/bin/swtpm --version
          /usr/local/bin/swtpm cuse --help | head -1
          ls /usr/lib/x86_64-linux-gnu/libtss2-tcti-tabrmd*
      - name: Build the KMS daemon and the audit collector (part 2 runs them)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for name in regalia-kms regalia-audit-collector; do go build -o "$RUNNER_TEMP/bin/$name" "./cmd/$name"; done
      - name: The four units, as shipped, under systemd; a peer's lease, the daemon, a revocation
        run: |
          set -o pipefail
          REGALIA_E2E_BIN="$RUNNER_TEMP/bin" sudo --preserve-env=RUNNER_ENVIRONMENT,REGALIA_E2E_BIN python3 -Es e2e/node-units-systemd.py | tee "$RUNNER_TEMP/units.log"
          grep -q '^node-units-systemd: 62 passed, 0 failed$' "$RUNNER_TEMP/units.log" || {
            echo "::error::the units test did not pass all 62 checks" >&2; exit 1; }

  # #278: the trail shipper's unit, as shipped, against the real collector: as its own user with no
  # capability it reads a trail only through its instance's group, and a trail cut short under what was
  # shipped stops it with an alarm and no restart.
  audit-ship-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the shipper and the audit collector
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for name in regalia-audit-ship regalia-audit-collector; do go build -o "$RUNNER_TEMP/bin/$name" "./cmd/$name"; done
      - name: The shipper's unit under systemd, against the collector
        run: |
          set -o pipefail
          REGALIA_E2E_BIN="$RUNNER_TEMP/bin" sudo --preserve-env=RUNNER_ENVIRONMENT,REGALIA_E2E_BIN python3 -Es e2e/audit-ship-systemd.py | tee "$RUNNER_TEMP/ship.log"
          grep -q '^audit-ship-systemd: 17 passed, 0 failed$' "$RUNNER_TEMP/ship.log" || {
            echo "::error::the shipper test did not pass all 17 checks" >&2; exit 1; }

  # #70 (Phase 10), PR 1: three nodes on one machine, each its real services in its own namespace against
  # its own software TPM, the fixture the recovery rehearsals build on (e2e/lib/threenode.py).
  three-node-netns:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The software TPM, tpm2-tools, WireGuard
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools tpm-udev wireguard-tools iproute2 python3-cryptography
      - name: Three nodes, their sync and wg-apply, the service mesh, a power cut
        run: |
          set -o pipefail
          sudo --preserve-env=RUNNER_ENVIRONMENT python3 -Es e2e/three-node-netns.py | tee "$RUNNER_TEMP/three.log"
          grep -q '^three-node-netns: 26 passed, 0 failed$' "$RUNNER_TEMP/three.log" || {
            echo "::error::the three-node test did not pass all 26 checks" >&2; exit 1; }

  # #70 (Phase 10), PR 2: every directed peer recovery path (PoC 10.1) and the nodes that must not be
  # restored, on the three-node fixture: real disks (LUKS2 on loop devices), the real pre-root client.
  three-node-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The software TPM, tpm2-tools, WireGuard, cryptsetup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools tpm-udev wireguard-tools iproute2 \
            python3-cryptography cryptsetup e2fsprogs
      - name: Build the pre-root client
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/regalia-unlock" ./cmd/regalia-unlock
      - name: Every directed recovery path, and the nodes that must not be restored
        run: |
          set -o pipefail
          REGALIA_UNLOCK_BIN="$RUNNER_TEMP/regalia-unlock" sudo --preserve-env=RUNNER_ENVIRONMENT,REGALIA_UNLOCK_BIN \
            python3 -Es e2e/three-node-recovery.py | tee "$RUNNER_TEMP/recovery.log"
          grep -q '^three-node-recovery: 52 passed, 0 failed$' "$RUNNER_TEMP/recovery.log" || {
            echo "::error::the three-node recovery test did not pass all 52 checks" >&2; exit 1; }

  # #71 (Phase 11): a total outage of the three nodes and the revocation authority, restored by one manual
  # recovery (the authority's host first; then one node by hand; then the other two through it).
  three-node-outage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The software TPM, tpm2-tools, WireGuard, cryptsetup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools tpm-udev wireguard-tools iproute2 \
            python3-cryptography cryptsetup e2fsprogs
      - name: Build the pre-root client
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/regalia-unlock" ./cmd/regalia-unlock
      - name: A total outage, the authority first, one node by hand, the rest through it
        run: |
          set -o pipefail
          REGALIA_UNLOCK_BIN="$RUNNER_TEMP/regalia-unlock" sudo --preserve-env=RUNNER_ENVIRONMENT,REGALIA_UNLOCK_BIN \
            python3 -Es e2e/three-node-outage.py | tee "$RUNNER_TEMP/outage.log"
          grep -q '^three-node-outage: 31 passed, 0 failed$' "$RUNNER_TEMP/outage.log" || {
            echo "::error::the three-node outage test did not pass all 31 checks" >&2; exit 1; }
