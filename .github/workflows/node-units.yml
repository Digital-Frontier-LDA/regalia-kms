# regalia-kms#80, step 3b: the node's four units under the runner's real systemd. It changes the machine
# (a kernel module, the system chrony and clock, a user, units), so it runs only here, and only when
# what it tests changes. Not a required check: the paths filter means it does not report on other PRs.
name: node units

on:
  pull_request:
    paths:
      - deploy/baremetal/**
      - e2e/node-units-systemd.py
      - .github/workflows/node-units.yml
      - internal/admission/**
      - internal/config/**
      - cmd/regalia-kms/**
      - cmd/regalia-audit-collector/**
      - cmd/regalia-audit-ship/**
      - internal/audit/**
      - e2e/audit-ship-systemd.py
      - e2e/three-node-netns.py
      - e2e/three-node-recovery.py
      - e2e/three-node-outage.py
      - e2e/three-node-reanchor.py
      - e2e/rolling-threenode.py
      - e2e/three-node-theft.py
      - e2e/three-node-leases.py
      - e2e/three-node-replace.py
      - cmd/regalia-unlock/**
      - e2e/lib/threenode.py
  push:
    branches: [main]
    paths:
      - deploy/baremetal/**
      - e2e/node-units-systemd.py
      - .github/workflows/node-units.yml
      - internal/admission/**
      - internal/config/**
      - cmd/regalia-kms/**
      - cmd/regalia-audit-collector/**
      - cmd/regalia-audit-ship/**
      - internal/audit/**
      - e2e/audit-ship-systemd.py
      - e2e/three-node-netns.py
      - e2e/three-node-recovery.py
      - e2e/three-node-outage.py
      - e2e/three-node-reanchor.py
      - e2e/rolling-threenode.py
      - e2e/three-node-theft.py
      - e2e/three-node-leases.py
      - e2e/three-node-replace.py
      - cmd/regalia-unlock/**
      - e2e/lib/threenode.py

permissions:
  contents: read

jobs:
  node-units-systemd:
    runs-on: ubuntu-24.04     # pinned: the chrony and systemd behaviour observed is 24.04's
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the software TPM, chrony and WireGuard tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools chrony wireguard-tools iproute2 \
            openssl python3-cryptography softhsm2 opensc libpcsclite-dev tpm2-abrmd libtss2-tcti-tabrmd0
          # tpm-udev: the tss group and its rule for /dev/tpmrm*. The runner's Azure kernel has no vTPM proxy
          # (CONFIG_TCG_VTPM_PROXY is not set), so the test makes the device with swtpm's CUSE mode.
          sudo apt-get install -y -qq --no-install-recommends tpm-udev
      - name: swtpm with its CUSE interface (Ubuntu builds it without; rebuilt from Ubuntu's own source package)
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq
          sudo apt-get build-dep -y -qq swtpm
          sudo apt-get install -y -qq --no-install-recommends libfuse-dev libfuse3-dev pkg-config libpcsclite-dev
          cd "$RUNNER_TEMP" && apt-get source -qq swtpm && cd swtpm-*/
          [ -x configure ] || autoreconf -fi
          ./configure -q --prefix=/usr/local --with-cuse --with-openssl
          make -s -j"$(nproc)"
          sudo make -s install
          sudo ldconfig
          /usr/local/bin/swtpm --version
          /usr/local/bin/swtpm cuse --help | head -1
          ls /usr/lib/x86_64-linux-gnu/libtss2-tcti-tabrmd*
      - name: Build the KMS daemon and the audit collector (part 2 runs them)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          # the daemon as production builds it (-tags piv): with admission required, a build without PC/SC refuses to start (#72, G2)
          go build -tags piv -o "$RUNNER_TEMP/bin/regalia-kms" ./cmd/regalia-kms
          go build -o "$RUNNER_TEMP/bin/regalia-audit-collector" ./cmd/regalia-audit-collector
      - name: The four units, as shipped, under systemd; a peer's lease, the daemon, a revocation
        run: |
          set -o pipefail
          REGALIA_E2E_BIN="$RUNNER_TEMP/bin" sudo --preserve-env=RUNNER_ENVIRONMENT,REGALIA_E2E_BIN python3 -Es e2e/node-units-systemd.py | tee "$RUNNER_TEMP/units.log"
          grep -q '^node-units-systemd: 70 passed, 0 failed$' "$RUNNER_TEMP/units.log" || {
            echo "::error::the units test did not pass all 70 checks" >&2; exit 1; }

  # #278: the trail shipper's unit, as shipped, against the real collector: as its own user with no
  # capability it reads a trail only through its instance's group, and a trail cut short under what was
  # shipped stops it with an alarm and no restart.
  audit-ship-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the shipper and the audit collector
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for name in regalia-audit-ship regalia-audit-collector; do go build -o "$RUNNER_TEMP/bin/$name" "./cmd/$name"; done
      - name: The shipper's unit under systemd, against the collector
        run: |
          set -o pipefail
          REGALIA_E2E_BIN="$RUNNER_TEMP/bin" sudo --preserve-env=RUNNER_ENVIRONMENT,REGALIA_E2E_BIN python3 -Es e2e/audit-ship-systemd.py | tee "$RUNNER_TEMP/ship.log"
          grep -q '^audit-ship-systemd: 21 passed, 0 failed$' "$RUNNER_TEMP/ship.log" || {
            echo "::error::the shipper test did not pass all 20 checks" >&2; exit 1; }

  # #70 (Phase 10), PR 1: three nodes on one machine, each its real services in its own namespace against
  # its own software TPM, the fixture the recovery rehearsals build on (e2e/lib/threenode.py).
  three-node-netns:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The software TPM, tpm2-tools, WireGuard
        run: |
          sudo apt-get update -qq
          # softhsm2, opensc and python3-pykcs11: the owner's two keys under v4 (#199), signed through Pkcs11Signer
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools tpm-udev wireguard-tools iproute2 python3-cryptography \
            softhsm2 opensc python3-pykcs11
      - name: Three nodes, their sync and wg-apply, the service mesh, a power cut
        run: |
          set -o pipefail
          sudo --preserve-env=RUNNER_ENVIRONMENT python3 -Es e2e/three-node-netns.py | tee "$RUNNER_TEMP/three.log"
          grep -q '^three-node-netns: 40 passed, 0 failed$' "$RUNNER_TEMP/three.log" || {
            echo "::error::the three-node test did not pass all 40 checks" >&2; exit 1; }

  # #70 (Phase 10), PR 2: every directed peer recovery path (PoC 10.1) and the nodes that must not be
  # restored, on the three-node fixture: real disks (LUKS2 on loop devices), the real pre-root client.
  three-node-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The software TPM, tpm2-tools, WireGuard, cryptsetup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools tpm-udev wireguard-tools iproute2 \
            python3-cryptography cryptsetup e2fsprogs softhsm2 opensc python3-pykcs11   # the owner's keys (#199)
      - name: Build the pre-root client, and the audit trail shipper and collector (#340)
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/regalia-unlock" ./cmd/regalia-unlock
          mkdir -p "$RUNNER_TEMP/audit"
          for name in regalia-audit-ship regalia-audit-collector; do go build -o "$RUNNER_TEMP/audit/$name" "./cmd/$name"; done
      - name: Every directed recovery path, and the nodes that must not be restored; every event in the audit collector
        run: |
          set -o pipefail
          REGALIA_UNLOCK_BIN="$RUNNER_TEMP/regalia-unlock" REGALIA_AUDIT_BIN="$RUNNER_TEMP/audit" \
            sudo --preserve-env=RUNNER_ENVIRONMENT,REGALIA_UNLOCK_BIN,REGALIA_AUDIT_BIN \
            python3 -Es e2e/three-node-recovery.py | tee "$RUNNER_TEMP/recovery.log"
          grep -q '^three-node-recovery: 69 passed, 0 failed$' "$RUNNER_TEMP/recovery.log" || {
            echo "::error::the three-node recovery test did not pass all 69 checks" >&2; exit 1; }

  # #75 (Phase 15), tier N: a new image rolled through the three nodes while CURRENT and NEXT are both accepted
  # (an image is PCR 11, extended after a power cycle); may_reboot on live leases as update.py asks it; the retire
  # judged from the peers' real attestation state.
  rolling-threenode:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The software TPM, tpm2-tools, WireGuard, cryptsetup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools tpm-udev wireguard-tools iproute2 \
            python3-cryptography cryptsetup e2fsprogs softhsm2 opensc python3-pykcs11   # the owner's keys (#199)
      - name: Build the pre-root client, and the audit trail shipper and collector (#340)
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/regalia-unlock" ./cmd/regalia-unlock
          mkdir -p "$RUNNER_TEMP/audit"
          for name in regalia-audit-ship regalia-audit-collector; do go build -o "$RUNNER_TEMP/audit/$name" "./cmd/$name"; done
      - name: A new image through three nodes, CURRENT and NEXT both accepted, then CURRENT retired; every event in the audit collector
        run: |
          set -o pipefail
          REGALIA_UNLOCK_BIN="$RUNNER_TEMP/regalia-unlock" REGALIA_AUDIT_BIN="$RUNNER_TEMP/audit" \
            sudo --preserve-env=RUNNER_ENVIRONMENT,REGALIA_UNLOCK_BIN,REGALIA_AUDIT_BIN \
            python3 -Es e2e/rolling-threenode.py | tee "$RUNNER_TEMP/rolling.log"
          grep -q '^rolling-threenode: 50 passed, 0 failed$' "$RUNNER_TEMP/rolling.log" || {
            echo "::error::the rolling-update test did not pass all 50 checks" >&2; exit 1; }

  # #71 (Phase 11): a total outage of the three nodes, restored by one manual recovery (one node by hand, its
  # heartbeat co-signed by an owner key, owner.py beat; then the other two through it; #199: no authority host).
  three-node-outage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The software TPM, tpm2-tools, WireGuard, cryptsetup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools tpm-udev wireguard-tools iproute2 \
            python3-cryptography cryptsetup e2fsprogs softhsm2 opensc python3-pykcs11   # the owner's keys (#199)
      - name: Build the pre-root client
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/regalia-unlock" ./cmd/regalia-unlock
      - name: A total outage, one node by hand, the rest through it
        run: |
          set -o pipefail
          REGALIA_UNLOCK_BIN="$RUNNER_TEMP/regalia-unlock" sudo --preserve-env=RUNNER_ENVIRONMENT,REGALIA_UNLOCK_BIN \
            python3 -Es e2e/three-node-outage.py | tee "$RUNNER_TEMP/outage.log"
          grep -q '^three-node-outage: 34 passed, 0 failed$' "$RUNNER_TEMP/outage.log" || {
            echo "::error::the three-node outage test did not pass all 34 checks" >&2; exit 1; }

  # #388: a re-anchor in a total outage. One node's TPM anchor unusable; the other two opened by hand, each with its own
  # recovery key; reanchor from their two chains at the node's terminal; the node serves again (MEMBERSHIP-RECOVERY.md).
  three-node-reanchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The software TPM, tpm2-tools, WireGuard, cryptsetup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools tpm-udev wireguard-tools iproute2 \
            python3-cryptography cryptsetup e2fsprogs softhsm2 opensc python3-pykcs11   # the owner's keys (#199)
      - name: Build the pre-root client
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/regalia-unlock" ./cmd/regalia-unlock
      - name: A total outage, one node's anchor unusable, re-anchored from the other two opened by hand
        run: |
          set -o pipefail
          REGALIA_UNLOCK_BIN="$RUNNER_TEMP/regalia-unlock" sudo --preserve-env=RUNNER_ENVIRONMENT,REGALIA_UNLOCK_BIN \
            python3 -Es e2e/three-node-reanchor.py | tee "$RUNNER_TEMP/reanchor.log"
          grep -q '^three-node-reanchor: 26 passed, 0 failed$' "$RUNNER_TEMP/reanchor.log" || {
            echo "::error::the three-node re-anchor test did not pass all 26 checks" >&2; exit 1; }

  # #76 (Phase 16): a node that failed for good replaced by a new host (one root-signed manifest, taken by the
  # running nodes by sync), and its retired hardware refused.
  three-node-replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The software TPM, tpm2-tools, WireGuard, cryptsetup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools tpm-udev wireguard-tools iproute2 \
            python3-cryptography cryptsetup e2fsprogs softhsm2 opensc python3-pykcs11   # the owner's keys (#199)
      - name: Build the pre-root client
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/regalia-unlock" ./cmd/regalia-unlock
      - name: A node replaced, and its retired hardware refused
        run: |
          set -o pipefail
          REGALIA_UNLOCK_BIN="$RUNNER_TEMP/regalia-unlock" sudo --preserve-env=RUNNER_ENVIRONMENT,REGALIA_UNLOCK_BIN \
            python3 -Es e2e/three-node-replace.py | tee "$RUNNER_TEMP/replace.log"
          grep -q '^three-node-replace: 16 passed, 0 failed$' "$RUNNER_TEMP/replace.log" || {
            echo "::error::the three-node replacement test did not pass all 16 checks" >&2; exit 1; }

  # #69 (Phase 9): a stolen node revoked by the owner off the nodes (revoke.py), the revocation spreading, and the window a
  # partition leaves (an nftables table inside one node's namespace only).
  three-node-theft:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The software TPM, tpm2-tools, WireGuard, cryptsetup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools tpm-udev wireguard-tools iproute2 \
            python3-cryptography cryptsetup e2fsprogs nftables softhsm2 opensc python3-pykcs11   # the owner's keys (#199)
      - name: Build the pre-root client, and the audit trail shipper and collector (#340)
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/regalia-unlock" ./cmd/regalia-unlock
          mkdir -p "$RUNNER_TEMP/audit"
          for name in regalia-audit-ship regalia-audit-collector; do go build -o "$RUNNER_TEMP/audit/$name" "./cmd/$name"; done
      - name: A stolen node revoked, its spread, and a partition's window; every event it caused in the audit collector
        run: |
          set -o pipefail
          REGALIA_UNLOCK_BIN="$RUNNER_TEMP/regalia-unlock" REGALIA_AUDIT_BIN="$RUNNER_TEMP/audit" \
            sudo --preserve-env=RUNNER_ENVIRONMENT,REGALIA_UNLOCK_BIN,REGALIA_AUDIT_BIN \
            python3 -Es e2e/three-node-theft.py | tee "$RUNNER_TEMP/theft.log"
          grep -q '^three-node-theft: 24 passed, 0 failed$' "$RUNNER_TEMP/theft.log" || {
            echo "::error::the three-node theft test did not pass all 24 checks" >&2; exit 1; }

  # #76 (Phase 16): a node that failed for good replaced by a new host (one root-signed manifest, taken by the
  # running nodes by sync), and its retired hardware refused.

  # #74 (Phase 14): runtime leases on three nodes signing their own heartbeats: renewal, failover to the other peer,
  # a partition, and a running node revoked by two nodes (it stops serving by itself at its lease's end).
  three-node-leases:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The software TPM, tpm2-tools, WireGuard, cryptsetup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools tpm-udev wireguard-tools iproute2 \
            python3-cryptography cryptsetup e2fsprogs nftables softhsm2 opensc python3-pykcs11   # the owner's keys (#199)
      - name: Build the pre-root client
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/regalia-unlock" ./cmd/regalia-unlock
      - name: Runtime leases, renewal and failover, a running node revoked
        run: |
          set -o pipefail
          REGALIA_UNLOCK_BIN="$RUNNER_TEMP/regalia-unlock" sudo --preserve-env=RUNNER_ENVIRONMENT,REGALIA_UNLOCK_BIN \
            python3 -Es e2e/three-node-leases.py | tee "$RUNNER_TEMP/leases.log"
          grep -q '^three-node-leases: 12 passed, 0 failed$' "$RUNNER_TEMP/leases.log" || {
            echo "::error::the three-node lease test did not pass all 12 checks" >&2; exit 1; }

  # #76 (Phase 16): a node that failed for good replaced by a new host (one root-signed manifest, taken by the
  # running nodes by sync), and its retired hardware refused.
