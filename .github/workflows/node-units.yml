# regalia-kms#80, step 3b: the node's four units under the runner's real systemd. It changes the machine
# (a kernel module, the system chrony and clock, a user, units), so it runs only here, and only when
# what it tests changes.
name: node units

on:
  pull_request:
    paths:
      - deploy/baremetal/**
      - e2e/node-units-systemd.py
      - .github/workflows/node-units.yml
  push:
    branches: [main]
    paths:
      - deploy/baremetal/**
      - e2e/node-units-systemd.py
      - .github/workflows/node-units.yml

permissions:
  contents: read

jobs:
  node-units-systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the software TPM, chrony, WireGuard tools and the vTPM proxy module
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools chrony wireguard-tools iproute2 \
            openssl python3-cryptography
          # tpm_vtpm_proxy is in the extra modules on the runner's kernel
          sudo apt-get install -y -qq --no-install-recommends "linux-modules-extra-$(uname -r)" || true
      - name: The four units, as shipped, under systemd (part 1)
        run: |
          set -o pipefail
          sudo python3 -Es e2e/node-units-systemd.py | tee "$RUNNER_TEMP/units.log"
          grep -q '^node-units-systemd: [0-9]* passed, 0 failed$' "$RUNNER_TEMP/units.log" || {
            echo "::error::the units test failed" >&2; exit 1; }
