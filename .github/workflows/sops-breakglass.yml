# Reusable: swap the organisation-wide SOPS breakglass recipient in the calling repository, one stage
# at a time, and open a pull request with the result. tools/sops_breakglass.py does the work; this
# only provisions pinned tools and publishes the change for review.
#
# Call it from each repository (workflow_dispatch in the caller):
#
#   jobs:
#     breakglass:
#       uses: Digital-Frontier-LDA/regalia-kms/.github/workflows/sops-breakglass.yml@<commit sha>
#       with: { stage: add, old: "age1…", new: "age1pq1…", tool_ref: "<the same commit sha>" }
#       secrets: { SOPS_AGE_KEY: "${{ secrets.SOPS_AGE_KEY }}" }
#       permissions: { contents: write, pull-requests: write }
#
# ORDER (doc/SOPS-MIGRATION.md in the private tracking repository): `add` in every repository, merge
# each PR; `check` everywhere; a recovery drill opens a file with the new key; only then `remove`,
# in every repository in one sitting. `remove` refuses to run while any file lacks the new key.
# Only the new key's PUBLIC recipient is ever an input here; its secret half never reaches Actions.
name: sops breakglass swap (reusable)

on:
  workflow_call:
    inputs:
      stage:
        description: "add | check | remove"
        required: true
        type: string
      old:
        description: "the retired breakglass recipient (age1…)"
        required: false
        type: string
        default: ""
      new:
        description: "the new breakglass recipient (age1pq1…)"
        required: true
        type: string
      tool_ref:
        description: "full commit SHA of regalia-kms to take tools/sops_breakglass.py from"
        required: true
        type: string
    secrets:
      SOPS_AGE_KEY:
        description: "this repository's CI key, which can decrypt its SOPS files"
        required: true

permissions:
  contents: read

jobs:
  swap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: validate inputs
        env:
          STAGE: ${{ inputs.stage }}
          OLD: ${{ inputs.old }}
          NEW: ${{ inputs.new }}
          TOOL_REF: ${{ inputs.tool_ref }}
        run: |
          set -euo pipefail
          case "$STAGE" in add|check|remove) ;; *) echo "stage must be add, check or remove"; exit 2;; esac
          [[ "$TOOL_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "tool_ref must be a full 40-hex commit SHA"; exit 2; }
          [[ "$NEW" =~ ^age1[0-9a-z]+$ ]] || { echo "new is not an age recipient"; exit 2; }
          if [ "$STAGE" != check ]; then [[ "$OLD" =~ ^age1[0-9a-z]+$ ]] || { echo "old is not an age recipient"; exit 2; }; fi

      - name: check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # the PR push below uses the job token

      - name: check out the tool at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Digital-Frontier-LDA/regalia-kms
          ref: ${{ inputs.tool_ref }}
          path: .regalia-kms-tool
          persist-credentials: false

      - name: provision pinned sops 3.13.1 and age 1.3.2
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sops" https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64
          echo "620a9d7e3352ababeca6908cea24a6e8b14ce89a448ddbd3f94f1ef3398f470a  $RUNNER_TEMP/sops" | sha256sum --check --strict
          curl -fsSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $RUNNER_TEMP/age.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP" --strip-components=1 age/age age/age-keygen
          chmod 0755 "$RUNNER_TEMP/sops" "$RUNNER_TEMP/age" "$RUNNER_TEMP/age-keygen"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          python3 -c "import yaml" 2>/dev/null || pip3 install --user "pyyaml==6.0.2"

      - name: run the stage
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          STAGE: ${{ inputs.stage }}
          OLD: ${{ inputs.old }}
          NEW: ${{ inputs.new }}
        run: |
          set -euo pipefail
          T=.regalia-kms-tool/tools/sops_breakglass.py
          if [ "$STAGE" = check ]; then
            if [ -n "$OLD" ]; then python3 "$T" check --require "$NEW" --forbid "$OLD"; else python3 "$T" check --require "$NEW"; fi
          else
            python3 "$T" "$STAGE" --old "$OLD" --new "$NEW"
          fi

      - name: open a pull request with the change
        if: inputs.stage != 'check'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          rm -rf .regalia-kms-tool
          if git diff --quiet; then echo "nothing changed"; exit 0; fi
          branch="sops-breakglass-$STAGE-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "sops: breakglass swap, stage $STAGE"
          git push -q origin "$branch"
          gh pr create --head "$branch" --title "sops: breakglass swap, stage $STAGE" \
            --body "Automated by the regalia-kms sops-breakglass workflow (run ${GITHUB_RUN_ID}). Stage **$STAGE**: see the run log for the per-file OK lines. Review, then merge."
