# Build, test, and vulnerability scan for the Go module. Self-contained; least-privilege.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install PC/SC dev headers (the -tags piv / OpenPGP cgo build needs libpcsclite)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev

      - name: gofmt (formatting is not optional)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"; echo "$unformatted"; exit 1
          fi

      - name: go vet (every module)
        run: |
          go vet ./...
          ( cd adapters/sops && go vet ./... )
          ( cd adapters/gpgsign && go vet ./... )

      - name: build (default + piv tag)
        run: |
          go build ./...
          go build -tags piv ./...

      # umask 002, not the runner's 022: t.TempDir() and checked-out files take their mode from
      # the umask, and every loader here refuses group-writable input. Fixtures that only pass
      # because the umask happened to trim the group bit would otherwise stay green until a
      # developer on a user-private-group system ran them (TESTING.md §13).
      # WITHOUT promtool THE ALERT-RULE FIRING TESTS SKIP, and a skip is a pass. They did, on every
      # run after regalia#487 moved this code out of the monorepo whose workflow installed it.
      - name: Install checksum-pinned promtool for alert-rule fault injection
        env:
          PROMETHEUS_SHA256: 0e8c4d46101bd025ea8265e377d2caabc57f488fc1be1c367f37db69ea41be6f
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/prometheus.tar.gz" \
            https://github.com/prometheus/prometheus/releases/download/v3.13.2/prometheus-3.13.2.linux-amd64.tar.gz
          echo "$PROMETHEUS_SHA256  $RUNNER_TEMP/prometheus.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/prometheus.tar.gz" \
            --directory "$RUNNER_TEMP" --strip-components=1 prometheus-3.13.2.linux-amd64/promtool
          chmod 0755 "$RUNNER_TEMP/promtool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: PIN delivery by TPM import, against a software TPM (swtpm; no card)
        # seal-hsm-pin.sh --init-import-key / --from-blob: key creation, refusal, replacement,
        # decryption of a ceremony-made blob, and refusal of a foreign or altered blob BEFORE any card
        # is looked at. The card half is the hardware drill (e2e/nitrokey-pin-import-drill.sh).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools opensc
          bash e2e/pin-import-swtpm.sh

      - name: signed PCR 11 policy for the PIN, against a software TPM (swtpm; stub card)
        # seal-hsm-pin.sh --tpm2-public-key/--tpm2-public-key-pcrs 11 (#57): sealed under PCR 7 plus a
        # systemd-measure-signed PCR 11, opened across a signed kernel update without re-sealing, and
        # refused for an unsigned kernel, another key, a changed PCR 7 or an uncovered boot phase.
        run: bash e2e/pcr-signed-policy-swtpm.sh

      - name: TPM lockout settings and power cuts, against software TPMs (swtpm)
        # deploy/baremetal/tpm-lockout.sh sets the dictionary-attack policy and a lockout authorization;
        # host_probe's tpm_lockout_policy measures it and fails on drift; the PIN import key (noda)
        # is unaffected by power cuts, a PIN credential counts one try per cut and the tries heal (#57).
        run: bash e2e/tpm-lockout-swtpm.sh

      - name: Bare-metal host firewall, by behaviour, in network namespaces
        # The rendered default-deny ruleset is loaded only inside a throwaway namespace; the zones probe
        # it with network_probe.py, and outbound is checked against the declared sinks.
        run: |
          sudo apt-get install -y -qq --no-install-recommends nftables iproute2 wireguard-tools
          sudo bash e2e/baremetal-firewall-netns.sh

      - name: python guards (deploy, custody manifest, alert rules, e2e wiring)
        # The Go suite does not cover the deployment tooling, the custody-manifest validator, the
        # alert rules or the documentation contracts — those are Python, and they gate the same
        # repository. Run them the way the tests expect to be discovered.
        env:
          # promtool is provisioned above, so a missing one is a failure here, not a skip.
          ALERT_RULES_JOB: "1"
          # tests/test_shell_locale.py runs the shell validators under en_US.UTF-8, generated below,
          # so a missing locale is a failure here, not a skip.
          REGALIA_EXPECT_UTF8_LOCALE: "1"
        run: |
          sudo apt-get install -y -qq --no-install-recommends locales >/dev/null
          sudo locale-gen en_US.UTF-8 >/dev/null
          python3 -Es -m unittest discover -s tests -p 'test_*.py'

      - name: test (both modules, race + vet)
        env:
          # internal/pin's mlock refusal can only be exercised where mlock can be made to fail, and
          # on linux it can. With this set the test fails rather than skips if that stops being true.
          REGALIA_EXPECT_MLOCK_ENFORCED: "1"
          # cmd/regalia-unlock reads the TPM high-water anchor that membership.HighWater wrote on a swtpm
          # (installed above, with tpm2-tools); with this set, a missing tool fails instead of skipping.
          REGALIA_EXPECT_SWTPM: "1"
          # internal/pin's ACL guard needs a filesystem that takes POSIX ACLs; the runner's does.
          REGALIA_EXPECT_ACL_GUARD_ENFORCED: "1"
        run: |
          umask 002
          go test -race ./...
          ( cd adapters/sops && go test -race ./... )
          # regalia-sign's claim is that GnuPG and git accept what it makes, so both must be here:
          # with this set, a test that cannot find them fails instead of skipping.
          gpg --version | head -1 && git --version
          ( cd adapters/gpgsign && REGALIA_EXPECT_GPG=1 go test -race ./... )

  # The benchmark harness is Python, and its regression tests need no card and no PyKCS11 — a fake
  # module stands in for the library. Without this job they would ship untested in a Go-only CI,
  # which is how the handle-reuse defect they pin reached review in the first place.
  bench-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: unit tests for the PKCS#11 benchmark harness
        env:
          # The per-curve peer-point checks need `cryptography`. It is installed here, hash-pinned,
          # with the harness's own requirements; with this set, the test fails rather than passes
          # if it is somehow absent. PyKCS11 is installed too and never used: the tests put a fake
          # module in its place.
          REGALIA_EXPECT_CRYPTOGRAPHY: "1"
        run: |
          # In its own virtual environment: the harness then runs -Es (no PYTHON* variables, no user
          # site) and still finds what was installed for it.
          python3 -I -m venv "$RUNNER_TEMP/bench"
          "$RUNNER_TEMP/bench/bin/python" -I -m pip install --quiet --require-hashes -r tools/bench/requirements.txt
          "$RUNNER_TEMP/bench/bin/python" -Es tools/bench/test_hsm_bench.py

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck (pinned)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan every module for known-vulnerable, reachable dependencies
        run: |
          govulncheck ./...
          ( cd adapters/sops && govulncheck ./... )
          ( cd adapters/gpgsign && govulncheck ./... )

  # THE CONCRETE PKCS#11 DRIVER, AGAINST A REAL (SOFTWARE) MODULE. Every test that proves the driver,
  # the KEK provenance guards, seal/release and the SOPS mTLS chain on a real PKCS#11 module skips
  # without the token e2e/softhsm-pkcs11.sh provisions — and after regalia#487 nothing here ran it,
  # so all of them passed by skipping. Closure evidence for regalia#12, #6 and #24 cites this run.
  pkcs11-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the PKCS#11 emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends softhsm2 opensc gnupg
          test -f /usr/lib/softhsm/libsofthsm2.so || { echo "libsofthsm2.so missing after install" >&2; exit 1; }
          # Set in THIS step: gpg is provisioned here, so the regalia-sign test skipping is a failure.
          echo "REGALIA_EXPECT_GPG=1" >> "$GITHUB_ENV"

      - name: Install checksum-pinned SOPS 3.13.3
        env:
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/sops" \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "$SOPS_SHA256  $RUNNER_TEMP/sops" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/sops"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          # Set in THIS step: sops is provisioned here, so a SOPS test that skips is a failure.
          echo "REGALIA_EXPECT_SOPS=1" >> "$GITHUB_ENV"

      - name: PKCS#11 extraction probe calibration (protected key REFUSED, exposed key LEAK) — may not skip
        env:
          REGALIA_EXPECT_SOFTHSM: "1"
        run: python3 -Es -m unittest -v tests.test_p11_extract_probe

      - name: SoftHSM battery — and NOTHING in it may skip
        env:
          GOFLAGS: -v
        run: |
          status=0
          e2e/softhsm-pkcs11.sh > "$RUNNER_TEMP/e2e.log" 2>&1 || status=$?
          grep -E -- '^--- (PASS|FAIL|SKIP)' "$RUNNER_TEMP/e2e.log" || true
          [ "$status" -eq 0 ] || { tail -60 "$RUNNER_TEMP/e2e.log"; exit "$status"; }
          # A SKIP HERE IS A GAP, NOT A PASS. This battery exists to run these tests; one that
          # skipped (a missing env var in the script, a missing binary) proved nothing, and that
          # is exactly how four KEK tests "passed" for their whole life without executing.
          if grep -E -- '--- SKIP' "$RUNNER_TEMP/e2e.log"; then
            echo "::error::a test in the SoftHSM battery skipped — it did not run" >&2
            exit 1
          fi
          # And the battery must have run at all.
          [ "$(grep -cE -- '^--- PASS' "$RUNNER_TEMP/e2e.log")" -ge 17 ] || {
            echo "::error::fewer than 17 tests passed in the SoftHSM battery" >&2; exit 1; }

  # Checks that need a context the main job does not have: root, and time.
  privileged-and-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: The credential-ownership guard, which only root can reach
        env:
          # Refusing a credential owned by a THIRD uid needs a file that uid owns, which needs chown,
          # which needs root — so as `runner` the test can only skip. This makes the skip a failure.
          REGALIA_EXPECT_UID_GUARD_ENFORCED: "1"
        run: |
          # Compile as the normal user, run as root, so root never writes into GOCACHE.
          go test -race -c -o "$RUNNER_TEMP/pin.test" ./internal/pin
          status=0
          sudo --preserve-env=REGALIA_EXPECT_UID_GUARD_ENFORCED \
            "$RUNNER_TEMP/pin.test" -test.v \
            -test.run '^TestACredentialOwnedByAThirdUserIsRefused$' || status=$?
          exit $status

      - name: Fuzz the unauthenticated and malformed operation boundary
        run: go test ./internal/api -run='^$' -fuzz=FuzzOperationBoundaryNeverPanicsOrEchoesInput -fuzztime=20s

      # The two parsers that read client bytes before anything is verified. The SignDoc target
      # fuzzes the INNER parser: the exported one recovers panics into a refusal, which would hide
      # every crash a fuzzer finds.
      - name: Fuzz the Cosmos SignDoc parser (panics and refusal class)
        run: go test ./internal/policy -run='^$' -fuzz=FuzzParseSignDocNeverPanicsAndRefusesAsSignDocErrors -fuzztime=20s

      - name: Fuzz envelope parsing (refusal class and round-trip stability)
        run: go test ./internal/envelope -run='^$' -fuzz=FuzzParseAcceptsOnlyWhatItCanReproduce -fuzztime=20s

  # #61, PoC 1.2: the KMS unit's sandbox by behaviour. A dummy service under the shipped unit and
  # hardening drop-in is refused writes outside its state directory, home directories, the kernel,
  # privilege and unused socket families; the same service with none of the settings is allowed each
  # one (the control), and what the KMS needs still works. It starts root units on the runner's own
  # system manager, which is why it has a job, and a runner, to itself.
  kms-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The shipped sandbox refuses what it should, with a control for every refusal
        run: bash e2e/kms-sandbox-negative.sh

  # #61: the other half of kms-sandbox. The REAL daemon, started by systemd from the shipped unit and
  # hardening drop-in, serves a signature from a SoftHSM token that openssl verifies, and the hardening
  # is measured on that process (os_probe.py). It installs a binary, a user, a unit and an AppArmor
  # profile (complain mode) on the runner, so it has a runner to itself too.
  kms-hardened-serve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the PKCS#11 emulator and the AppArmor parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends softhsm2 opensc apparmor acl
      - name: The real daemon serves a verifiable signature inside the shipped sandbox
        run: bash e2e/kms-hardened-serve.sh

  # regalia#439, RE-PROVEN ON EVERY CHANGE: a live Cosmos node accepts the transactions the KMS
  # signed, and every negative case fails for its own reason — replay, chain id, destination,
  # sequence, account number, fee and gas, several messages, malformed sign bytes, the daily quota
  # and a superseded epoch (e2e/cosmos-simapp-kms-tx.sh; the table is in e2e/README.md). ADR-0002 D7: simd is built HERE from a pinned Cosmos
  # SDK commit — no binary is downloaded, so the node under test is exactly what the tag's source
  # says. The build is cached by that commit; a cache miss costs one build, never a different binary.
  cosmos-node:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COSMOS_SDK_TAG: v0.50.15
      COSMOS_SDK_COMMIT: 8c7741050ad8c7ef0b6afd9129fb2dd9a91d30d4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Restore simd built from the pinned commit
        id: simd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/simd
          key: simd-${{ env.COSMOS_SDK_COMMIT }}-${{ runner.os }}

      - name: Build simd from the pinned commit (cache miss only)
        if: steps.simd-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 --branch "$COSMOS_SDK_TAG" https://github.com/cosmos/cosmos-sdk.git "$RUNNER_TEMP/cosmos-sdk"
          # A TAG CAN MOVE; A COMMIT CANNOT. Refuse a tag that no longer names the reviewed commit.
          got="$(git -C "$RUNNER_TEMP/cosmos-sdk" rev-parse HEAD)"
          [ "$got" = "$COSMOS_SDK_COMMIT" ] || { echo "::error::$COSMOS_SDK_TAG is $got, not the pinned $COSMOS_SDK_COMMIT"; exit 1; }
          ( cd "$RUNNER_TEMP/cosmos-sdk/simapp" && GOFLAGS=-mod=mod go build -o "$RUNNER_TEMP/simd" ./simd )

      - name: Install the PKCS#11 emulator and the pinned cosmpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends softhsm2 opensc jq
          python3 -I -m venv "$RUNNER_TEMP/cosmpy"
          "$RUNNER_TEMP/cosmpy/bin/pip" install --quiet cosmpy==0.12.2 cryptography==50.0.1

      - name: A live node accepts KMS-signed transactions, and every negative case fails for its own reason
        env:
          REGALIA_COSMOS_SIMD_BIN: ${{ runner.temp }}/simd
          REGALIA_COSMOS_PYTHON: ${{ runner.temp }}/cosmpy/bin/python
        run: |
          "$REGALIA_COSMOS_SIMD_BIN" version
          e2e/cosmos-simapp-kms-tx.sh

  # regalia-kms#65 PoC 5.1/5.4/5.5: a peer verifies a node's TPM quote. Two software TPMs (swtpm):
  # the AK is bound to the recorded EK by MakeCredential/ActivateCredential, a fresh quote over the
  # boot-session transcript is accepted, and a replay, each substituted transcript field, changed
  # PCRs, another TPM's AK, a session carried across a reboot and rolled-back TPM state are refused.
  # The script exits nonzero on any FAIL; the count guards against it passing by running nothing.
  tpm-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the software TPM and tpm2-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools
      - name: TPM attestation against swtpm (enrollment, fresh quote, replay, reboots)
        run: |
          status=0
          bash e2e/tpm-attest-swtpm.sh > "$RUNNER_TEMP/attest.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/attest.log"
          [ "$status" -eq 0 ] || exit "$status"
          grep -q '^tpm-attest-swtpm: 31 passed, 0 failed$' "$RUNNER_TEMP/attest.log" || {
            echo "::error::the attestation battery did not run all 31 checks" >&2; exit 1; }
      - name: regalia-node enrol init against swtpm (keys made on the host, nothing foreign touched, a crash at every call) — may not skip
        env:
          REGALIA_EXPECT_SWTPM: "1"
        run: |
          sudo apt-get install -y -qq --no-install-recommends wireguard-tools python3-cryptography
          python3 -BEs -m unittest -v tests.test_baremetal_enrol

  # regalia-kms#61: the AppArmor profile the bare-metal unit asks for by name. The parser compiles it
  # without loading it, so this proves the profile is well-formed and says what the tests read in it;
  # it does not prove a daemon runs under it. That is measured on the host (kms_apparmor_enforced).
  apparmor-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the AppArmor parser and its abstractions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends apparmor
      - name: The profile compiles, and the parser check cannot pass by skipping
        env:
          REGALIA_EXPECT_APPARMOR_PARSER: "1"
        run: python3 -Es -m unittest -v tests.test_baremetal_apparmor

  # regalia-kms#69: freshness heartbeats. The TPM half on a software TPM: the heartbeat sequence in
  # its own NV counter (replay and disk rollback refused), and the TPM clock behind the time floor.
  # The script fails if any of its three tests is skipped.
  heartbeat-swtpm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the software TPM and tpm2-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools
      - name: Heartbeat sequence counter and TPM clock against swtpm
        run: bash e2e/heartbeat-swtpm.sh

  # regalia-kms#74: runtime trust leases, on two software TPMs. Node a re-attests to peer b, b's TPM
  # signs a 5-minute lease, a holds and renews it; a revoked a is refused renewal; a rebooted a needs
  # a new attested session. The script fails if either of its two tests is skipped.
  runtime-lease-swtpm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the software TPM and tpm2-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools
      - name: Runtime leases against swtpm (issue, hold, revoke, reboot)
        run: bash e2e/runtime-lease-swtpm.sh

  # regalia-kms#77: the disk recovery key, on a real dm-crypt volume (a loop device). With every other
  # keyslot destroyed, the recovery key alone opens and mounts it; a wrong key, one wrong letter, no
  # dashes, other grouping and capitals do not; a used key is replaced and then opens nothing. The
  # script fails if the file-backed tests of recovery-key.sh do not all run. Every header sync under a
  # fault is lab/recovery/matrix.py (recovery-matrix.yml, #175).
  luks-recovery-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cryptsetup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cryptsetup-bin
          command -v systemd-cryptenroll || sudo apt-get install -y -qq --no-install-recommends systemd-cryptsetup
          command -v systemd-cryptenroll
      - name: The recovery key alone opens the volume (loop device, LUKS2)
        run: sudo bash e2e/luks-recovery-key.sh

  # regalia-kms#66: the boot mesh, by behaviour, in network namespaces with real WireGuard interfaces.
  # A booting node reaches its peers' unlock port through the tunnel and nothing else; an outsider, a
  # key from an undeclared address (the stolen server elsewhere) and a revoked node get no answer;
  # loss, latency, an unreachable peer and a wrong key each end within a bound. Every ruleset is
  # loaded only inside a throwaway namespace.
  wg-boot-netns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WireGuard tools, nftables, conntrack, and the kernel's extra modules (netem)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wireguard-tools nftables iproute2 conntrack "linux-modules-extra-$(uname -r)"
      - name: The boot mesh, by behaviour (WireGuard, the initrd ruleset, the host firewall)
        run: sudo bash e2e/wg-boot-netns.sh

  # regalia-kms#66: a host BOOTS through a peer. A Debian 13 guest in QEMU (KVM when the runner has it)
  # with a software TPM and its whole disk a LUKS2 volume; its initrd is built by the guest's own dracut
  # with the module of deploy/baremetal/initrd. Three boots: enrolment (the console asks, the recovery
  # key opens), unattended (systemd unseals the credentials, WireGuard comes up before root, a peer
  # gives its half, nobody types anything), and no peer (the console asks for the recovery key).
  unlock-boot-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install QEMU, the guest builder, the software TPM, WireGuard and nftables
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 mmdebstrap debian-archive-keyring \
            swtpm swtpm-tools tpm2-tools cryptsetup-bin wireguard-tools nftables iproute2 cpio e2fsprogs ovmf dosfstools openssl
      - name: A guest boots a measured UKI through a peer (QEMU, OVMF, swtpm, dracut, LUKS2, WireGuard before root, PCR 12)
        # the archive as of the reviewed initrd's inventory (deploy/baremetal/initrd/initrd-inventory.txt, #198):
        # moving this date is an update of that inventory, in the same pull request. The initrd and its client
        # are built by deploy/baremetal/initrd/build-initrd.sh (#248), with the Go release go.mod pins.
        run: sudo REGALIA_GO="$(command -v go)" REGALIA_BOOT_MIRROR=https://snapshot.debian.org/archive/debian/20261003T121500Z/ REGALIA_BOOT_SECURITY_MIRROR=https://snapshot.debian.org/archive/debian-security/20261003T121500Z/ bash e2e/unlock-boot-qemu.sh

  # regalia-kms#248: the KMS host initrd is REPRODUCIBLE, and stays so. deploy/baremetal/initrd/build-initrd.sh
  # builds it from pinned inputs (one snapshot.debian.org time with the security suite, dracut --reproducible,
  # SOURCE_DATE_EPOCH). Three builders: two Ubuntu runners, each building twice (the second in a hostile
  # locale, time zone, umask and environment), and a Debian 13 container (another host userland, the one a
  # real builder runs). initrd-reproducible-compare FAILS unless every initrd and build record is identical.
  initrd-reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        builder: [first, second]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the root-tree builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mmdebstrap debian-archive-keyring zstd
      - name: Build the initrd three times from nothing (the second in a hostile environment, host apt configuration included); all must be identical
        run: sudo REGALIA_GO="$(command -v go)" REGALIA_HOSTILE_APT=1 bash e2e/initrd-reproducible.sh "$RUNNER_TEMP/repro" 3
      - name: Make the builds readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/repro" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: initrd-${{ matrix.builder }}
          path: ${{ runner.temp }}/repro/build-1
          retention-days: 7
      # on a difference, every build, to diff offline (#248: two builds once differed by 161 bytes with the same files)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: initrd-${{ matrix.builder }}-every-build
          path: ${{ runner.temp }}/repro
          retention-days: 14

  initrd-reproducible-debian:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install what a Debian 13 builder has
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git mmdebstrap debian-archive-keyring python3 cpio zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the initrd three times from nothing, on Debian 13; all must be identical
        run: REGALIA_GO="$(command -v go)" bash e2e/initrd-reproducible.sh "$RUNNER_TEMP/repro" 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: initrd-debian
          path: ${{ runner.temp }}/repro/build-1
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: initrd-debian-every-build
          path: ${{ runner.temp }}/repro
          retention-days: 14

  initrd-reproducible-compare:
    needs: [initrd-reproducible, initrd-reproducible-debian]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/builds
      - name: Every builder's initrd and build record are identical
        run: |
          cd "$RUNNER_TEMP/builds"
          for b in initrd-first initrd-second initrd-debian; do
            echo "$b: $(python3 -I -c 'import json,sys; r=json.load(open(sys.argv[1])); print(r["initrd_sha256"], r["initrd_entries"], "entries, commit", r["commit"][:12], r["go"], "client", r["client_sha256"])' "$b/initrd-build.json")"
          done
          bad=0
          for b in initrd-second initrd-debian; do
            if ! cmp -s initrd-first/initrd.img "$b/initrd.img"; then
              bad=1; echo "::error::$b's initrd differs from initrd-first's"
              diff initrd-first/initrd-listing.txt "$b/initrd-listing.txt" | head -200 || true
            fi
            if ! cmp -s initrd-first/initrd-build.json "$b/initrd-build.json"; then
              bad=1; echo "::error::$b's build record differs from initrd-first's"
              diff initrd-first/initrd-build.json "$b/initrd-build.json" | head -60 || true
            fi
          done
          [ "$bad" = 0 ] || exit 1
          echo "initrd-reproducible: IDENTICAL on three builders: $(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["initrd_sha256"])' initrd-first/initrd-build.json)"

  # regalia-kms#69 / #80: authenticated time, against live chrony daemons with NTS. Two private NTS
  # servers and a client on the loopback, none allowed to touch the runner's clock. The clock counts
  # as authenticated only while chrony is synchronised to two agreeing NTS sources; one server
  # stopping, a plain NTP source in the configuration, and a check that has stopped each end it.
  authtime-chrony-nts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install chrony
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends chrony python3-cryptography
      - name: The clock is authenticated only under two agreeing NTS sources (live chronyd)
        run: |
          set -o pipefail
          python3 -Es e2e/authtime-chrony-nts.py | tee "$RUNNER_TEMP/authtime.log"
          grep -q '^authtime-chrony-nts: 18 passed, 0 failed$' "$RUNNER_TEMP/authtime.log" || {
            echo "::error::the authenticated-time test did not run all 18 checks" >&2; exit 1; }

  # regalia-kms#80: regalia-sync over real WireGuard, in network namespaces. Three nodes and the
  # revocation authority, each with a wg-svc interface configured from the manifest and read back from
  # the kernel. A node pulls the chain and the heartbeat through the tunnel; a lease is issued across
  # it; a revoked node is refused by name while its tunnel is up and gets no answer once the peer is
  # reconciled; an address that is not its key's does not get through; a peer list widened by hand is
  # detected and repaired; a partitioned node catches up in rounds and authorizes nothing until a
  # heartbeat for the tip arrives. Every interface lives in a throwaway namespace.
  regalia-sync-netns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WireGuard tools and the Python the libraries need
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wireguard-tools iproute2 python3-cryptography
      - name: regalia-sync between three namespaces and the authority (real WireGuard)
        run: |
          set -o pipefail
          sudo python3 -Es e2e/regalia-sync-netns.py | tee "$RUNNER_TEMP/sync.log"
          grep -q '^regalia-sync-netns: 32 passed, 0 failed$' "$RUNNER_TEMP/sync.log" || {
            echo "::error::the sync test did not run all 32 checks" >&2; exit 1; }

  # regalia-kms#67 (and the software half of #135): a KMS host's disk opens with its TPM and one peer,
  # never the TPM alone. Three software TPMs and a real dm-crypt volume on a loop device: either peer
  # restores the node, no peer leaves it locked, and a retired boot image, another machine and a
  # revoked node get nothing. Each step is made with the native pre-root client (cmd/regalia-unlock)
  # against the Python peer over TCP. Then the shipped systemd units (deploy/baremetal/initrd/) are
  # started by the runner's systemd and the real systemd-cryptsetup takes the key from their socket.
  # The script fails if any of its tests is skipped.
  peer-unlock-swtpm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the software TPM, tpm2-tools and cryptsetup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools cryptsetup-bin
          # systemd-cryptsetup is its own package from systemd 256 on; before that it is part of systemd
          sudo apt-get install -y -qq --no-install-recommends systemd-cryptsetup 2>/dev/null || true
      - name: Build the pre-root client (static, no cgo)
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/regalia-unlock" ./cmd/regalia-unlock
      - name: TPM plus one peer opens the volume (swtpm, loop device, LUKS2; the native client and the reference one)
        # REGALIA_EXPECT_SYSTEMD: the runner has a running systemd, so the shipped units are started for real
        # and systemd-cryptsetup itself asks for the key; without them the script fails instead of skipping.
        run: sudo REGALIA_EXPECT_SYSTEMD=1 REGALIA_UNLOCK_BIN="$RUNNER_TEMP/regalia-unlock" bash e2e/peer-unlock-swtpm.sh

  # regalia-kms#76: replacing a node, on three software TPMs (the old node, the new one, a peer). One
  # root-signed manifest retires the old node and enrolls the new; the new one attests, is unlocked and
  # holds a lease; the old hardware is refused by every decision; its identities cannot be enrolled
  # again. The script fails if its test is skipped.
  node-replacement-swtpm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the software TPM and tpm2-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools
      - name: Node replacement against swtpm (enroll the new node, refuse the old hardware)
        run: bash e2e/node-replacement-swtpm.sh

  # regalia-kms#135 (found under #75): a MEASUREMENT, not a control. Can an NV-backed TPM policy
  # (systemd-pcrlock) retire a boot image for a LUKS2 volume, with no peer? A software TPM, a LUKS2 volume
  # in a file, systemd's own tools: approve a second image, boot it, retire the first, and try each,
  # including the retired image with the old policy file restored. Debian 13, because that is what the
  # KMS hosts run (systemd 257). Privileged, with the runner's /dev: the unlock needs device-mapper.
  pcrlock-luks-swtpm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: debian:13
      options: --privileged -v /dev:/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install systemd's TPM and LUKS tools, the software TPM and tpm2-tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends systemd systemd-cryptsetup cryptsetup-bin swtpm swtpm-tools tpm2-tools python3 util-linux
      - name: NV-backed (pcrlock) policy on a LUKS2 volume against swtpm (approve, update, retire, refuse the old image)
        run: bash e2e/pcrlock-luks-swtpm.sh

  # regalia-kms#57: the boot image of a KMS host. Debian 13's own ukify, systemd-measure and sbsign build
  # a unified kernel image twice (the same bytes), sign its PCR 11 once per boot phase with two TEST keys
  # and the file for Secure Boot with a third, from key files and from a PKCS#11 token (SoftHSM). A
  # software TPM then measures the image's sections as systemd-stub would: its PCR 11 is the build
  # record's value in the initrd and again once booted, and a secret sealed to each phase's key opens
  # with the image's own signature in that phase only. Nothing is booted; no real key is used.
  uki-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: debian:13
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the image tools, the software token and the software TPM
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends systemd systemd-ukify systemd-boot-efi sbsigntool openssl softhsm2 \
            libengine-pkcs11-openssl swtpm swtpm-tools tpm2-tools python3 python3-cryptography cpio dracut-core kmod
      - name: Fetch Debian's kernel package, unpacked and not installed (the image's .linux)
        run: |
          mkdir -p /tmp/kernel && cd /tmp/kernel
          pkg="$(apt-cache depends linux-image-amd64 | awk '/Depends: linux-image-/{print $2; exit}')"
          apt-get download "$pkg"
          sha256sum ./*.deb
          dpkg -x ./*.deb root
          ls root/boot/
      - name: Build, sign and replay the image on a software TPM
        shell: bash
        run: |
          set -o pipefail
          set -- /tmp/kernel/root/boot/vmlinuz-*
          LINUX="$1" bash e2e/uki-build.sh | tee "$RUNNER_TEMP/uki.log"
          grep -q '^uki-build: 33 passed, 0 failed$' "$RUNNER_TEMP/uki.log"
          grep '^uki-build: image ' "$RUNNER_TEMP/uki.log" >> "$GITHUB_STEP_SUMMARY"
      # A MEASUREMENT, NOT A GATE: two runs gave identical bytes and one did not (regalia-kms#57, run
      # 37080073972), so the answer so far is "not reliably". The step reports, and on a difference names
      # the first cpio member that differs; it does not fail a PR that touches nothing in the image.
      - name: Is a dracut initrd reproducible? (a measurement for the build design, regalia-kms#57; does not gate)
        continue-on-error: true
        shell: bash
        run: |
          set -- /tmp/kernel/root/boot/vmlinuz-*
          kver="${1##*/vmlinuz-}"
          kmod="/tmp/kernel/root/usr/lib/modules/$kver"
          [ -d "$kmod" ] || kmod="/tmp/kernel/root/lib/modules/$kver"
          [ -d "$kmod" ] || { echo "no modules directory for $kver in the kernel package"; exit 1; }
          depmod -b "${kmod%/lib/modules/*}" "$kver"
          for n in 1 2; do
            dracut --force --no-hostonly --no-hostonly-cmdline --reproducible --kver "$kver" --kmoddir "$kmod" "/tmp/initrd-$n.img" > "/tmp/dracut-$n.log" 2>&1 \
              || { tail -30 "/tmp/dracut-$n.log"; exit 1; }
            sleep 2
          done
          sha256sum /tmp/initrd-1.img /tmp/initrd-2.img | tee -a "$GITHUB_STEP_SUMMARY"
          if cmp -s /tmp/initrd-1.img /tmp/initrd-2.img; then echo "dracut: the two builds are identical" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # where: list each image's members with their sizes and digests, and show the first difference
          for n in 1 2; do
            mkdir -p "/tmp/x$n"
            if ! (cd "/tmp/x$n" && lsinitrd --unpack "/tmp/initrd-$n.img" >/dev/null 2>&1); then
              echo "lsinitrd could not unpack initrd-$n.img" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            (cd "/tmp/x$n" && find . -type f -exec sha256sum {} + | sort -k2) > "/tmp/members-$n.txt"
          done
          { echo "dracut: the two builds DIFFER; first differing members:"; diff /tmp/members-1.txt /tmp/members-2.txt | head -20; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  # regalia-kms#69: convergence, on two software TPMs. A revoked node's manifests reach one peer in a
  # bundle; the partitioned peer helps only until its heartbeat expires, catches up through the chain
  # in one exchange (its TPM epoch counter follows), and its disk rolled back is refused. The script
  # fails if its test is skipped.
  convergence-swtpm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the software TPM and tpm2-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools
      - name: Manifest convergence against swtpm (bundle, partition, catch-up, rollback)
        run: bash e2e/convergence-swtpm.sh

  # regalia-kms#75: a kernel update rolled through three nodes, on three software TPMs. The root approves
  # CURRENT and NEXT in one manifest; the nodes reboot one at a time, in order, each unlocked by its
  # peers on the new image; a failed image falls back to CURRENT; CURRENT is retired once every node was
  # seen on NEXT; the old image, booted again, is then refused, and so is a peer's membership restored
  # from before the retirement. The script fails if its test is skipped.
  rolling-policy-swtpm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the software TPM and tpm2-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools
      - name: Rolling measured-boot update against swtpm (approve, one node at a time, retire, refuse the old image)
        run: bash e2e/rolling-policy-swtpm.sh

  # regalia-kms#143: a real sshd on the example configuration and a real ssh on the known_hosts that
  # ssh_trust.py writes from a membership manifest. A certificate from the user CA logs in to the node
  # it names; another node's name, a retired node's key, a bare key and a bad certificate are refused.
  # No port (ProxyCommand runs `sshd -i`), no FIDO token. The script fails if a test is skipped.
  ssh-trust-sshd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OpenSSH server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends openssh-server openssh-client
      - name: SSH host identity from the manifest, and certificate-only logins, against sshd
        run: bash e2e/ssh-trust-sshd.sh

  # regalia-kms#74: the real daemon serves key operations only while the node holds a runtime lease.
  # SoftHSM for the token; the lease is real (node and peer on software TPMs) and reaches the daemon
  # through the admission file. Not ready and 503 without a lease; a verified signature with one;
  # stops by itself when renewal stops; refuses at once when the node is revoked.
  runtime-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the PKCS#11 emulator, the software TPM and their tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends softhsm2 opensc swtpm swtpm-tools tpm2-tools libpcsclite-dev
      - name: The daemon serves only while admitted (SoftHSM, leases on swtpm)
        run: |
          status=0
          python3 -Es e2e/runtime-admission.py > "$RUNNER_TEMP/admission.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/admission.log"
          [ "$status" -eq 0 ] || exit "$status"
          grep -q '^runtime-admission: 32 passed, 0 failed$' "$RUNNER_TEMP/admission.log" || {
            echo "::error::the admission test did not run all 32 checks" >&2; exit 1; }
