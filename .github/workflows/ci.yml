# Build, test, and vulnerability scan for the Go module. Self-contained; least-privilege.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install PC/SC dev headers (the -tags piv / OpenPGP cgo build needs libpcsclite)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev

      - name: gofmt (formatting is not optional)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"; echo "$unformatted"; exit 1
          fi

      - name: go vet (every module)
        run: |
          go vet ./...
          ( cd adapters/sops && go vet ./... )
          ( cd adapters/gpgsign && go vet ./... )

      - name: build (default + piv tag)
        run: |
          go build ./...
          go build -tags piv ./...

      # umask 002, not the runner's 022: t.TempDir() and checked-out files take their mode from
      # the umask, and every loader here refuses group-writable input. Fixtures that only pass
      # because the umask happened to trim the group bit would otherwise stay green until a
      # developer on a user-private-group system ran them (TESTING.md §13).
      # WITHOUT promtool THE ALERT-RULE FIRING TESTS SKIP, and a skip is a pass. They did, on every
      # run after regalia#487 moved this code out of the monorepo whose workflow installed it.
      - name: Install checksum-pinned promtool for alert-rule fault injection
        env:
          PROMETHEUS_SHA256: 0e8c4d46101bd025ea8265e377d2caabc57f488fc1be1c367f37db69ea41be6f
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/prometheus.tar.gz" \
            https://github.com/prometheus/prometheus/releases/download/v3.13.2/prometheus-3.13.2.linux-amd64.tar.gz
          echo "$PROMETHEUS_SHA256  $RUNNER_TEMP/prometheus.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/prometheus.tar.gz" \
            --directory "$RUNNER_TEMP" --strip-components=1 prometheus-3.13.2.linux-amd64/promtool
          chmod 0755 "$RUNNER_TEMP/promtool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: PIN delivery by TPM import, against a software TPM (swtpm; no card)
        # seal-hsm-pin.sh --init-import-key / --from-blob: key creation, refusal, replacement,
        # decryption of a ceremony-made blob, and refusal of a foreign or altered blob BEFORE any card
        # is looked at. The card half is the hardware drill (e2e/nitrokey-pin-import-drill.sh).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools opensc
          bash e2e/pin-import-swtpm.sh

      - name: signed PCR 11 policy for the PIN, against a software TPM (swtpm; stub card)
        # seal-hsm-pin.sh --tpm2-public-key/--tpm2-public-key-pcrs 11 (#57): sealed under PCR 7 plus a
        # systemd-measure-signed PCR 11, opened across a signed kernel update without re-sealing, and
        # refused for an unsigned kernel, another key, a changed PCR 7 or an uncovered boot phase.
        run: bash e2e/pcr-signed-policy-swtpm.sh

      - name: Bare-metal host firewall, by behaviour, in network namespaces
        # The rendered default-deny ruleset is loaded only inside a throwaway namespace; the zones probe
        # it with network_probe.py, and outbound is checked against the declared sinks.
        run: |
          sudo apt-get install -y -qq --no-install-recommends nftables iproute2
          sudo bash e2e/baremetal-firewall-netns.sh

      - name: python guards (deploy, custody manifest, alert rules, e2e wiring)
        # The Go suite does not cover the deployment tooling, the custody-manifest validator, the
        # alert rules or the documentation contracts — those are Python, and they gate the same
        # repository. Run them the way the tests expect to be discovered.
        env:
          # promtool is provisioned above, so a missing one is a failure here, not a skip.
          ALERT_RULES_JOB: "1"
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: test (both modules, race + vet)
        env:
          # internal/pin's mlock refusal can only be exercised where mlock can be made to fail, and
          # on linux it can. With this set the test fails rather than skips if that stops being true.
          REGALIA_EXPECT_MLOCK_ENFORCED: "1"
          # internal/pin's ACL guard needs a filesystem that takes POSIX ACLs; the runner's does.
          REGALIA_EXPECT_ACL_GUARD_ENFORCED: "1"
        run: |
          umask 002
          go test -race ./...
          ( cd adapters/sops && go test -race ./... )
          # regalia-sign's claim is that GnuPG and git accept what it makes, so both must be here:
          # with this set, a test that cannot find them fails instead of skipping.
          gpg --version | head -1 && git --version
          ( cd adapters/gpgsign && REGALIA_EXPECT_GPG=1 go test -race ./... )

  # The benchmark harness is Python, and its regression tests need no card and no PyKCS11 — a fake
  # module stands in for the library. Without this job they would ship untested in a Go-only CI,
  # which is how the handle-reuse defect they pin reached review in the first place.
  bench-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: unit tests for the PKCS#11 benchmark harness
        env:
          # The per-curve peer-point checks need `cryptography`. It is installed here, hash-pinned,
          # with the harness's own requirements; with this set, the test fails rather than passes
          # if it is somehow absent. PyKCS11 is installed too and never used: the tests put a fake
          # module in its place.
          REGALIA_EXPECT_CRYPTOGRAPHY: "1"
        run: |
          python3 -m pip install --quiet --require-hashes -r tools/bench/requirements.txt
          python3 tools/bench/test_hsm_bench.py

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck (pinned)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan every module for known-vulnerable, reachable dependencies
        run: |
          govulncheck ./...
          ( cd adapters/sops && govulncheck ./... )
          ( cd adapters/gpgsign && govulncheck ./... )

  # THE CONCRETE PKCS#11 DRIVER, AGAINST A REAL (SOFTWARE) MODULE. Every test that proves the driver,
  # the KEK provenance guards, seal/release and the SOPS mTLS chain on a real PKCS#11 module skips
  # without the token e2e/softhsm-pkcs11.sh provisions — and after regalia#487 nothing here ran it,
  # so all of them passed by skipping. Closure evidence for regalia#12, #6 and #24 cites this run.
  pkcs11-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the PKCS#11 emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends softhsm2 opensc gnupg
          test -f /usr/lib/softhsm/libsofthsm2.so || { echo "libsofthsm2.so missing after install" >&2; exit 1; }
          # Set in THIS step: gpg is provisioned here, so the regalia-sign test skipping is a failure.
          echo "REGALIA_EXPECT_GPG=1" >> "$GITHUB_ENV"

      - name: Install checksum-pinned SOPS 3.13.3
        env:
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/sops" \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "$SOPS_SHA256  $RUNNER_TEMP/sops" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/sops"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          # Set in THIS step: sops is provisioned here, so a SOPS test that skips is a failure.
          echo "REGALIA_EXPECT_SOPS=1" >> "$GITHUB_ENV"

      - name: PKCS#11 extraction probe calibration (protected key REFUSED, exposed key LEAK) — may not skip
        env:
          REGALIA_EXPECT_SOFTHSM: "1"
        run: python3 -m unittest -v tests.test_p11_extract_probe

      - name: SoftHSM battery — and NOTHING in it may skip
        env:
          GOFLAGS: -v
        run: |
          status=0
          e2e/softhsm-pkcs11.sh > "$RUNNER_TEMP/e2e.log" 2>&1 || status=$?
          grep -E -- '^--- (PASS|FAIL|SKIP)' "$RUNNER_TEMP/e2e.log" || true
          [ "$status" -eq 0 ] || { tail -60 "$RUNNER_TEMP/e2e.log"; exit "$status"; }
          # A SKIP HERE IS A GAP, NOT A PASS. This battery exists to run these tests; one that
          # skipped (a missing env var in the script, a missing binary) proved nothing, and that
          # is exactly how four KEK tests "passed" for their whole life without executing.
          if grep -E -- '--- SKIP' "$RUNNER_TEMP/e2e.log"; then
            echo "::error::a test in the SoftHSM battery skipped — it did not run" >&2
            exit 1
          fi
          # And the battery must have run at all.
          [ "$(grep -cE -- '^--- PASS' "$RUNNER_TEMP/e2e.log")" -ge 16 ] || {
            echo "::error::fewer than 16 tests passed in the SoftHSM battery" >&2; exit 1; }

  # Checks that need a context the main job does not have: root, and time.
  privileged-and-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: The credential-ownership guard, which only root can reach
        env:
          # Refusing a credential owned by a THIRD uid needs a file that uid owns, which needs chown,
          # which needs root — so as `runner` the test can only skip. This makes the skip a failure.
          REGALIA_EXPECT_UID_GUARD_ENFORCED: "1"
        run: |
          # Compile as the normal user, run as root, so root never writes into GOCACHE.
          go test -race -c -o "$RUNNER_TEMP/pin.test" ./internal/pin
          status=0
          sudo --preserve-env=REGALIA_EXPECT_UID_GUARD_ENFORCED \
            "$RUNNER_TEMP/pin.test" -test.v \
            -test.run '^TestACredentialOwnedByAThirdUserIsRefused$' || status=$?
          exit $status

      - name: Fuzz the unauthenticated and malformed operation boundary
        run: go test ./internal/api -run='^$' -fuzz=FuzzOperationBoundaryNeverPanicsOrEchoesInput -fuzztime=20s

      # The two parsers that read client bytes before anything is verified. The SignDoc target
      # fuzzes the INNER parser: the exported one recovers panics into a refusal, which would hide
      # every crash a fuzzer finds.
      - name: Fuzz the Cosmos SignDoc parser (panics and refusal class)
        run: go test ./internal/policy -run='^$' -fuzz=FuzzParseSignDocNeverPanicsAndRefusesAsSignDocErrors -fuzztime=20s

      - name: Fuzz envelope parsing (refusal class and round-trip stability)
        run: go test ./internal/envelope -run='^$' -fuzz=FuzzParseAcceptsOnlyWhatItCanReproduce -fuzztime=20s

  # #61, PoC 1.2: the KMS unit's sandbox by behaviour. A dummy service under the shipped unit and
  # hardening drop-in is refused writes outside its state directory, home directories, the kernel,
  # privilege and unused socket families; the same service with none of the settings is allowed each
  # one (the control), and what the KMS needs still works. It starts root units on the runner's own
  # system manager, which is why it has a job, and a runner, to itself.
  kms-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The shipped sandbox refuses what it should, with a control for every refusal
        run: bash e2e/kms-sandbox-negative.sh

  # #61: the other half of kms-sandbox. The REAL daemon, started by systemd from the shipped unit and
  # hardening drop-in, serves a signature from a SoftHSM token that openssl verifies, and the hardening
  # is measured on that process (os_probe.py). It installs a binary, a user, a unit and an AppArmor
  # profile (complain mode) on the runner, so it has a runner to itself too.
  kms-hardened-serve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the PKCS#11 emulator and the AppArmor parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends softhsm2 opensc apparmor acl
      - name: The real daemon serves a verifiable signature inside the shipped sandbox
        run: bash e2e/kms-hardened-serve.sh

  # regalia#439, RE-PROVEN ON EVERY CHANGE: a live Cosmos node accepts the transactions the KMS
  # signed, and every negative case fails for its own reason — replay, chain id, destination,
  # sequence, account number, fee and gas, several messages, malformed sign bytes, the daily quota
  # and a superseded epoch (e2e/cosmos-simapp-kms-tx.sh; the table is in e2e/README.md). ADR-0002 D7: simd is built HERE from a pinned Cosmos
  # SDK commit — no binary is downloaded, so the node under test is exactly what the tag's source
  # says. The build is cached by that commit; a cache miss costs one build, never a different binary.
  cosmos-node:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COSMOS_SDK_TAG: v0.50.15
      COSMOS_SDK_COMMIT: 8c7741050ad8c7ef0b6afd9129fb2dd9a91d30d4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Restore simd built from the pinned commit
        id: simd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/simd
          key: simd-${{ env.COSMOS_SDK_COMMIT }}-${{ runner.os }}

      - name: Build simd from the pinned commit (cache miss only)
        if: steps.simd-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 --branch "$COSMOS_SDK_TAG" https://github.com/cosmos/cosmos-sdk.git "$RUNNER_TEMP/cosmos-sdk"
          # A TAG CAN MOVE; A COMMIT CANNOT. Refuse a tag that no longer names the reviewed commit.
          got="$(git -C "$RUNNER_TEMP/cosmos-sdk" rev-parse HEAD)"
          [ "$got" = "$COSMOS_SDK_COMMIT" ] || { echo "::error::$COSMOS_SDK_TAG is $got, not the pinned $COSMOS_SDK_COMMIT"; exit 1; }
          ( cd "$RUNNER_TEMP/cosmos-sdk/simapp" && GOFLAGS=-mod=mod go build -o "$RUNNER_TEMP/simd" ./simd )

      - name: Install the PKCS#11 emulator and the pinned cosmpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends softhsm2 opensc jq
          python3 -m venv "$RUNNER_TEMP/cosmpy"
          "$RUNNER_TEMP/cosmpy/bin/pip" install --quiet cosmpy==0.12.2 cryptography==50.0.1

      - name: A live node accepts KMS-signed transactions, and every negative case fails for its own reason
        env:
          REGALIA_COSMOS_SIMD_BIN: ${{ runner.temp }}/simd
          REGALIA_COSMOS_PYTHON: ${{ runner.temp }}/cosmpy/bin/python
        run: |
          "$REGALIA_COSMOS_SIMD_BIN" version
          e2e/cosmos-simapp-kms-tx.sh

  # regalia-kms#65 PoC 5.1/5.4/5.5: a peer verifies a node's TPM quote. Two software TPMs (swtpm):
  # the AK is bound to the recorded EK by MakeCredential/ActivateCredential, a fresh quote over the
  # boot-session transcript is accepted, and a replay, each substituted transcript field, changed
  # PCRs, another TPM's AK, a session carried across a reboot and rolled-back TPM state are refused.
  # The script exits nonzero on any FAIL; the count guards against it passing by running nothing.
  tpm-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the software TPM and tpm2-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swtpm swtpm-tools tpm2-tools
      - name: TPM attestation against swtpm (enrollment, fresh quote, replay, reboots)
        run: |
          status=0
          bash e2e/tpm-attest-swtpm.sh > "$RUNNER_TEMP/attest.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/attest.log"
          [ "$status" -eq 0 ] || exit "$status"
          grep -q '^tpm-attest-swtpm: 31 passed, 0 failed$' "$RUNNER_TEMP/attest.log" || {
            echo "::error::the attestation battery did not run all 31 checks" >&2; exit 1; }

  # regalia-kms#61: the AppArmor profile the bare-metal unit asks for by name. The parser compiles it
  # without loading it, so this proves the profile is well-formed and says what the tests read in it;
  # it does not prove a daemon runs under it. That is measured on the host (kms_apparmor_enforced).
  apparmor-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the AppArmor parser and its abstractions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends apparmor
      - name: The profile compiles, and the parser check cannot pass by skipping
        env:
          REGALIA_EXPECT_APPARMOR_PARSER: "1"
        run: python3 -m unittest -v tests.test_baremetal_apparmor
