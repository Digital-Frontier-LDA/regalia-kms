# Secret scanning — fail-closed, no paths filter, full history.
#
# Two deliberate properties (per the fleet security-posture standard):
#   * NO paths filter — a guard that only runs when you touch the guarded tree is not a guard.
#   * FULL HISTORY on main (fetch-depth 0) — a secret removed in a later commit is still published,
#     so deleting the line does not clear the finding; the credential still has to be rotated.
#
# The self-test step is not decoration: "found nothing" only means something once the instrument
# has been shown to fire. It plants a synthetic credential and fails the build unless gitleaks
# flags it. Self-contained (no private reusable workflows — a public repo cannot call those).
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not just the tip

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install gitleaks (pinned, from source)
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Prove the scanner can see a secret (self-test)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # Assemble the PEM header from split tokens so THIS workflow file never contains a
          # matchable secret literal that would flag itself.
          begin='-----BEGIN'; tail='PRIVATE KEY-----'
          { printf '%s OPENSSH %s\n' "$begin" "$tail"; openssl rand -base64 64; printf -- '-----END OPENSSH %s\n' "$tail"; } > "$tmp/planted.key"
          if gitleaks dir "$tmp" --no-banner --redact --config "$GITHUB_WORKSPACE/.gitleaks.toml"; then
            echo "::error::secret-scan self-test FAILED — gitleaks did not flag a planted key; the scanner or config is blind" >&2
            exit 1
          fi
          echo "self-test OK — scanner fires on planted material"

      # On a PR the subject is the commits it adds (what its author can act on); on main it is the
      # whole history, because a secret removed later is still published.
      - name: Scan this branch's commits (pull request)
        if: github.event_name == 'pull_request'
        # base_ref is passed via env and referenced as a quoted shell variable, never interpolated
        # into the run: script — a branch name can carry shell metacharacters (GitHub's documented
        # script-injection anti-pattern).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          gitleaks git . --no-banner --redact --config .gitleaks.toml \
            --log-opts="origin/${BASE_REF}..HEAD" \
            --report-format sarif --report-path gitleaks.sarif

      - name: Scan the full history of main (push)
        if: github.event_name != 'pull_request'
        run: |
          gitleaks git . --no-banner --redact --config .gitleaks.toml \
            --log-opts="HEAD" \
            --report-format sarif --report-path gitleaks.sarif

      - name: Scan the working tree for uncommitted credentials
        run: gitleaks dir . --no-banner --redact --config .gitleaks.toml

      - name: Upload findings report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
