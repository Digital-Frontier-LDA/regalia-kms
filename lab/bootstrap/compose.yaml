services:
  lab:
    image: regalia-bootstrap-lab:dev
    platform: "${REGALIA_LAB_PLATFORM:-linux/amd64}"
    build: .
    user: "${REGALIA_LAB_UID:-65532}:${REGALIA_LAB_GID:-65532}"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
    volumes:
      - ./.artifacts:/evidence
    environment:
      REGALIA_LAB_REPORT: /evidence/report.json
      REGALIA_LAB_COMMIT: "${REGALIA_LAB_COMMIT:-unknown}"
